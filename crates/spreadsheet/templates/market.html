<section class="sheet" aria-label="A sheet you can type into, beside a market that writes a feed" data-poll-label="Run the market">
<div class="sheet-view" role="region" aria-label="The grid" tabindex="0" hx-get="iki/tutorial/sheet/view/grid" hx-trigger="load, every 2s" data-poll></div>
<form class="sheet-bar" hx-post="iki/tutorial/sheet/view/edit" hx-target="next .sheet-reply">
<label>Cell <input name="ref" class="sheet-ref" size="3" maxlength="3" autocomplete="off" spellcheck="false" required></label>
<label>Input <input name="content" class="sheet-content" size="18" autocomplete="off" spellcheck="false"></label>
<button type="submit">Enter</button>
</form>
<p class="sheet-reply" role="status"></p>
<div class="sheet-market" data-outside>
<p class="sheet-ticker" hx-post="iki/tutorial/sheet/tick/acme" hx-trigger="every 3s" hx-target="find .sheet-price" data-poll>While the market runs, it writes a new price to the feed <code>acme</code> every three seconds. The last it wrote: <span class="sheet-price">nothing yet</span>.</p>
<p class="sheet-move"><button type="button" hx-post="iki/tutorial/sheet/tick/acme" hx-target="next .sheet-moved">The market moves</button> Once, by hand. It wrote: <output class="sheet-moved">nothing yet</output></p>
</div>
</section>
