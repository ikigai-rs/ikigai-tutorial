<section class="sheet" aria-label="A sheet the kernel tells when a value changes">
<div class="sheet-view" role="region" aria-label="The grid" tabindex="0">
<table class="sheet-grid">
<caption>The sheet: the value of each cell, each drawn on its own</caption>
<thead><tr><td></td><th scope="col">A</th><th scope="col">B</th><th scope="col">C</th><th scope="col">D</th></tr></thead>
<tbody>
<tr><th scope="row">1</th><td hx-get="iki/tutorial/sheet/view/cell/A1" hx-trigger="load, stale, every 2s" data-poll></td><td hx-get="iki/tutorial/sheet/view/cell/B1" hx-trigger="load, stale, every 2s" data-poll></td><td hx-get="iki/tutorial/sheet/view/cell/C1" hx-trigger="load, stale, every 2s" data-poll></td><td hx-get="iki/tutorial/sheet/view/cell/D1" hx-trigger="load, stale, every 2s" data-poll></td></tr>
<tr><th scope="row">2</th><td hx-get="iki/tutorial/sheet/view/cell/A2" hx-trigger="load, stale, every 2s" data-poll></td><td hx-get="iki/tutorial/sheet/view/cell/B2" hx-trigger="load, stale, every 2s" data-poll></td><td hx-get="iki/tutorial/sheet/view/cell/C2" hx-trigger="load, stale, every 2s" data-poll></td><td hx-get="iki/tutorial/sheet/view/cell/D2" hx-trigger="load, stale, every 2s" data-poll></td></tr>
<tr><th scope="row">3</th><td hx-get="iki/tutorial/sheet/view/cell/A3" hx-trigger="load, stale, every 2s" data-poll></td><td hx-get="iki/tutorial/sheet/view/cell/B3" hx-trigger="load, stale, every 2s" data-poll></td><td hx-get="iki/tutorial/sheet/view/cell/C3" hx-trigger="load, stale, every 2s" data-poll></td><td hx-get="iki/tutorial/sheet/view/cell/D3" hx-trigger="load, stale, every 2s" data-poll></td></tr>
<tr><th scope="row">4</th><td hx-get="iki/tutorial/sheet/view/cell/A4" hx-trigger="load, stale, every 2s" data-poll></td><td hx-get="iki/tutorial/sheet/view/cell/B4" hx-trigger="load, stale, every 2s" data-poll></td><td hx-get="iki/tutorial/sheet/view/cell/C4" hx-trigger="load, stale, every 2s" data-poll></td><td hx-get="iki/tutorial/sheet/view/cell/D4" hx-trigger="load, stale, every 2s" data-poll></td></tr>
<tr><th scope="row">5</th><td hx-get="iki/tutorial/sheet/view/cell/A5" hx-trigger="load, stale, every 2s" data-poll></td><td hx-get="iki/tutorial/sheet/view/cell/B5" hx-trigger="load, stale, every 2s" data-poll></td><td hx-get="iki/tutorial/sheet/view/cell/C5" hx-trigger="load, stale, every 2s" data-poll></td><td hx-get="iki/tutorial/sheet/view/cell/D5" hx-trigger="load, stale, every 2s" data-poll></td></tr>
<tr><th scope="row">6</th><td hx-get="iki/tutorial/sheet/view/cell/A6" hx-trigger="load, stale, every 2s" data-poll></td><td hx-get="iki/tutorial/sheet/view/cell/B6" hx-trigger="load, stale, every 2s" data-poll></td><td hx-get="iki/tutorial/sheet/view/cell/C6" hx-trigger="load, stale, every 2s" data-poll></td><td hx-get="iki/tutorial/sheet/view/cell/D6" hx-trigger="load, stale, every 2s" data-poll></td></tr>
</tbody>
</table>
</div>
<form class="sheet-bar" hx-post="iki/tutorial/sheet/view/edit" hx-target="next .sheet-reply">
<label>Cell <input name="ref" class="sheet-ref" size="3" maxlength="3" autocomplete="off" spellcheck="false" required></label>
<label>Input <input name="content" class="sheet-content" size="18" autocomplete="off" spellcheck="false"></label>
<button type="submit">Enter</button>
</form>
<p class="sheet-reply" role="status"></p>
<div class="sheet-market" data-outside>
<p class="sheet-ticker" hx-post="iki/tutorial/sheet/tick/acme" hx-trigger="every 3s" hx-target="find .sheet-price" data-market>While the market runs, it writes a new price to the feed <code>acme</code> every three seconds. The last it wrote: <span class="sheet-price">nothing yet</span>.</p>
<p class="sheet-move"><button type="button" hx-post="iki/tutorial/sheet/tick/acme" hx-target="next .sheet-moved">The market moves</button> Once, by hand. It wrote: <output class="sheet-moved">nothing yet</output></p>
</div>
</section>
