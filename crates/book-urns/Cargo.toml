[package]
name = "book-urns"
version = "0.1.0"
description = "The book's URN gate. Not a lesson: a test. Every resource name the book prints has to resolve in a host something can actually reach, and prose has no compiler."
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
publish = false

[lib]
name = "book_urns"
path = "src/lib.rs"

[dependencies]
# Deliberately none. The scanner is text in, classification out — keeping it dependency-
# free means the part with the fiddly rules is unit-testable on its own.

[dev-dependencies]
ikigai-core.workspace = true
futures.workspace = true
hello-camel = { path = "../hello-camel" }
building-endpoints = { path = "../building-endpoints" }
loadable-module = { path = "../loadable-module" }
your-endpoints = { path = "../your-endpoints" }
tic-tac-toe = { path = "../tic-tac-toe" }
time-resource = { path = "../time-resource" }
spreadsheet = { path = "../spreadsheet" }
push = { path = "../push" }
# "A space that changes while it runs": its host, after the chapter's first declaration bound.
live-space = { path = "../live-space" }
shop = { path = "../shop" }
# "Checking a resource": its host, with the toolbox's and the shapes check's spaces mounted.
check-resource = { path = "../check-resource" }
# The section "Code and language as resources": the script host, and the drafting host that
# mounts ikigai-nl beside it.
script-host = { path = "../script-host" }
sentence-draft = { path = "../sentence-draft" }
# "Streams, I: bytes are a representation": its listings build a kernel over ikigai-compress's
# space alone.
ikigai-compress.workspace = true
# "Exploring without Rust": the recorded week and its headline template (`urn:quakes:*`), which
# the part's prose names as well as its cells.
quakes = { path = "../quakes" }
# The one parser for `<!-- transcript: … -->` (ledger #1075): the REPL replay reads a block's
# declaration exactly as the console runner and the `cargo run` check do.
book-transcripts = { path = "../book-transcripts" }
# The page's kernel, so "may a cell name this" is asked of the space the page really
# runs (`book_wasm::page_space()`), not of a copy of its composition kept here.
book-wasm = { path = "../book-wasm" }
