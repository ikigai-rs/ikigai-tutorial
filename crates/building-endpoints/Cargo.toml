[package]
name = "building-endpoints"
version = "0.1.0"
description = "The code taught by Building endpoints: a transreptor, a multi-verb endpoint with a declared capability, the graph face, a hermetically tested clock, and a host that reads a config file."
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
publish = false

[lib]
name = "building_endpoints"
path = "src/lib.rs"

[[bin]]
name = "building"
path = "src/bin/building.rs"

[dependencies]
ikigai-core.workspace = true
ikigai-vocab.workspace = true
ikigai-sparql.workspace = true
# Not used by this crate, and NOT a defense: a direct dependency is its own edge and never
# constrains another crate's. `spareval` (under oxigraph, under ikigai-sparql) takes md-5, sha1
# and sha2 as three independent `>=0.10,<0.12` edges and bounds them all by md-5's `Digest`, so
# a lock that pairs sha2 0.10 with md-5/sha1 0.11 on spareval fails to compile ("the trait bound
# `…: Digest` is not satisfied", nowhere near the cause). A fresh resolve never produces that:
# it takes 0.11 for all three even with these pins beside it (measured, ledger #1148). An
# incremental one can (a `cargo add` or `update -p` while `ikigai-quic`'s `sha2 = "0.10"` is
# locked). This workspace's lock sits on the consistent 0.10 series because of its history, not
# because of these lines. If it ever mixes: `cargo tree -p spareval -e normal --depth 1`, then
# `cargo update -p <the stale crate>@<its version>` (never --precise). ikigai-devtools'
# `just lock-lint` checks every committed lock daily (ledger #1195).
md-5 = "0.10"
sha1 = "0.10"
oxttl.workspace = true
oxrdf.workspace = true
toml.workspace = true
futures.workspace = true
# Part I's space, chained onto: the endpoints these chapters describe, query and
# transrept are the ones the reader already has.
hello-camel = { path = "../hello-camel" }

[dev-dependencies]
# The scanner behind tests/book_runs.rs: dependency-free, so no cycle (ledger #1072).
book-transcripts = { path = "../book-transcripts" }
