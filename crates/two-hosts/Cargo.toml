[package]
name = "two-hosts"
version = "0.1.0"
description = "The code taught by Part III of the ikigai tutorial: a kernel behind a socket, the authority a certificate mints, and the three ways a mount can relate to the local namespace."
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
publish = false

[lib]
name = "two_hosts"
path = "src/lib.rs"

[dependencies]
ikigai-core.workspace = true
# The transports themselves, so the book's examples are compiled against the real
# signatures rather than a paraphrase of them. Both are cheap in dependency terms
# except `ikigai-quic`, which brings quinn/rustls/tokio — paid deliberately, because
# the `Minter` signature IS the lesson of "Who is asking" and a prose copy of it
# would rot silently. 0.1.41 because that release added `Session.principal`, a public field, so
# the `Session { … }` literal in `src/identity.rs` names it: under the old "0.1.18" a fresh resolve
# took 0.1.41 and the listing the book prints no longer compiled. 0.1.44 is the pin for both and
# for `ikigai-resolve` below: the cli crates' published head, so the transports the book
# compiles against are the ones its REPL transcripts' `ikigai` ships.
ikigai-ipc = "0.1.44"
ikigai-quic = "0.1.44"
# `MountedRemote` (the alias/override composition) and the `Resolver` surface a
# connected peer presents.
ikigai-resolve = "0.1.44"
# `Failover` — what `--prefer` is made of. 0.1.11, the published head.
ikigai-throttle = "0.1.11"
async-trait = "0.1"
futures.workspace = true

[dev-dependencies]
# A local space to fail over TO, and the name Part I already taught.
hello-camel = { path = "../hello-camel" }
