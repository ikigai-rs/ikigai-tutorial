[package]
name = "two-hosts"
version = "0.1.0"
description = "The code taught by Part III of the ikigai tutorial: a kernel behind a socket, the authority a certificate mints, and the three ways a mount can relate to the local namespace."
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
publish = false

[lib]
name = "two_hosts"
path = "src/lib.rs"

[dependencies]
ikigai-core.workspace = true
# The transports themselves, so the book's examples are compiled against the real
# signatures rather than a paraphrase of them. Both are cheap in dependency terms
# except `ikigai-quic`, which brings quinn/rustls/tokio — paid deliberately, because
# the `Minter` signature IS the lesson of "Who is asking" and a prose copy of it
# would rot silently. 0.1.41 because that release added `Session.principal`, a public field, so
# the `Session { … }` literal in `src/identity.rs` names it: under the old "0.1.18" a fresh resolve
# took 0.1.41 and the listing the book prints no longer compiled. 0.1.63 is the pin for both and
# for `ikigai-resolve` below (set 2026-10-14). Wire v9 (0.1.66) is newer and not taken: it would
# move the wire the book's transcripts replay, which is ledger #2060's pass. The gonk Book's pinned gonk links 0.1.61; 0.1.63 changed no
# transport crate's source and 0.1.62 changed no wire, and 0.1.57 to 0.1.61 changed only HTTP
# doors (a DELETE answers with its body, an `Expect: 100-continue` is invited, a dead listener
# ends the accept loop on Windows).
# 0.2.1 is the pin (set 2026-10-27, ledger #2365, the core 0.2.0 sweep): the newest release, and
# one on ikigai-core 0.2, the streams release (ledger #2261); the old pin "0.1.63" was a ceiling
# below 0.2.0 that held it on core 0.1. A 0.x caret: also a ceiling (<0.3.0).
ikigai-ipc = "0.2.1"
# 0.2.1 is the pin (set 2026-10-27, ledger #2365, the core 0.2.0 sweep): the newest release, and
# one on ikigai-core 0.2, the streams release (ledger #2261); the old pin "0.1.63" was a ceiling
# below 0.2.0 that held it on core 0.1. A 0.x caret: also a ceiling (<0.3.0).
ikigai-quic = "0.2.1"
# `MountedRemote` (the alias/override composition) and the `Resolver` surface a
# connected peer presents.
# 0.2.1 is the pin (set 2026-10-27, ledger #2365, the core 0.2.0 sweep): the newest release, and
# one on ikigai-core 0.2, the streams release (ledger #2261); the old pin "0.1.63" was a ceiling
# below 0.2.0 that held it on core 0.1. A 0.x caret: also a ceiling (<0.3.0).
ikigai-resolve = "0.2.1"
# `Failover` — what `--prefer` is made of. 0.2.0 is the floor (set 2026-10-21) because "Preference"
# teaches what it changed: `Failover` decides by core 0.1.108's `Error::class()`, advancing on a
# transient OR a retry-after failure of an idempotent verb (`Verb::is_idempotent`), and returns
# every other class unchanged; `src/mounts.rs` tests both. With a run's retry budget configured,
# each advance spends from it; no host here configures one. The old pin "0.1.11" was a ceiling
# below 0.2. 0.2.1 is the pin (set 2026-10-24), kept in step with the ecosystem's release: it adds
# the observable state face (`urn:throttle:state`, ledger #198), the `thr:` vocabulary (ledger
# #2175) and a `Timeout` that takes an injected timer and so runs in the page (ledger #2189), which
# the architecture book's resilience harness (ledger #2174) builds on. Nothing here changed
# behavior. 0.2.2 (2026-10-25) writes the state face's strings with core's `turtle_literal`
# (ledger #2184, #2222), so it takes ikigai-core 0.1.112 and no RDF library on wasm32; kept in
# step with the resilience harness's pin. A 0.x caret: also a ceiling (<0.3.0, until 2026-10-27).
# 0.3.0 is the pin (set 2026-10-27, ledger #2365, the core 0.2.0 sweep): the newest release, and
# one on ikigai-core 0.2, the streams release (ledger #2261); the old pin "0.2.2" was a ceiling
# below 0.3.0 that held it on core 0.1. A 0.x caret: also a ceiling (<0.4.0).
ikigai-throttle = "0.3.0"
async-trait = "0.1"
futures.workspace = true

[dev-dependencies]
# A local space to fail over TO, and the name Part I already taught.
hello-camel = { path = "../hello-camel" }
