[package]
name = "book-wasm"
version = "0.1.0"
description = "The book's own kernel, in the page: a wasm-bindgen face over the book's spaces (Part I and the tic-tac-toe game) and the CLI's engine, so a chapter's runnable cells resolve for real."
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
publish = false

[lib]
name = "book_wasm"
path = "src/lib.rs"
# `cdylib` is the wasm; `rlib` keeps the crate buildable, lintable and testable natively,
# so the workspace gates see it like any other crate.
crate-type = ["cdylib", "rlib"]

[dependencies]
ikigai-core.workspace = true
# Part I's space and host — the same `kernel()` the chapter's tests run against, so a
# cell in the page and a listing in the crate answer the same question the same way.
hello-camel = { path = "../hello-camel" }
# The applied chapter's game (tic-tac-toe), composed beside Part I's space in ONE page
# kernel — see `page_space()`. Its names do not overlap Part I's, so every existing cell
# answers exactly as it did.
tic-tac-toe = { path = "../tic-tac-toe" }
# "Time is a resource": the clock, the date, events and countdowns. Its names do not
# overlap either family above. They answer only on a page whose kernel has a clock
# (`useClock`), and refuse, saying so, everywhere else.
time-resource = { path = "../time-resource" }
# The spreadsheet arc: inputs, compiled formulas, values, the grid. `urn:iki:tutorial:sheet:*`
# overlaps nothing above. Its grid view composes through `urn:iki:fn:compose`, which Part
# I's space already binds on the page.
spreadsheet = { path = "../spreadsheet" }
# Part VII's host half of push: a cut listener as a resource, what a read carries, and the
# page's memory of the views it drew. `urn:iki:tutorial:push:*` overlaps nothing above.
push = { path = "../push" }
# "A space that changes while it runs": its host (the declaration resource, the picture of the
# host's own arrangement, and a dynamic space over a four-endpoint registry) is started on the
# page as a kernel of its own, for the cells that carry `data-live='…'` — see `Live`. It is not
# composed into `page_space()`: Part I's space already binds three of the names its registry
# binds, ahead of anything a dynamic space could hold, so an empty dynamic space would not look
# empty. Its dependencies (ikigai-fn, ikigai-sexpr, ikigai-diagram, core's `declare` feature)
# build for wasm32-unknown-unknown as they are.
live-space = { path = "../live-space" }
# "Checking a resource": the chapter's host (two players answering N-Triples under a scope, a
# transreptor to Turtle, the closed player shapes), with the RDF Toolbox's names
# (`ikigai-toolbox`: `urn:toolbox:input:{iri}`, `urn:toolbox:check:{iri}`) and the shapes check
# (`ikigai-shacl`'s subset validator) beside them. All three build for wasm32-unknown-unknown as
# they are. The toolbox's build is not a crate: the page binds it at `urn:iki:toolbox:dist:` over
# the copy the book publishes beside itself (`toolbox/`), see `dist_space`.
check-resource = { path = "../check-resource" }
# "Transreption" (its CSV section) and "Short names in a space": the shop's stock (CSV), its prefix
# table and templates (`urn:iki:tutorial:shop:*`), and through it ikigai-json's `urn:json:*`
# (jq, and the text/csv to application/json transreptor). Neither family overlaps anything above.
# The prefix space is not composed in: a cell carrying `data-prefixed='…'` runs in it, as a
# corridor on the page's kernel (see `Live::prefixed`). ikigai-json builds for wasm32 as it is; on
# wasm a sandbox bound reached aborts, which traps this kernel, so the chapters' programs stay far
# inside the bounds and say so.
shop = { path = "../shop" }
# "Streams, I: bytes are a representation": ikigai-compress's gzip and zlib endpoints
# (`urn:compress:*`, `urn:decompress:*`), which overlap nothing above. Its cells gzip the shop's
# stock and read it back.
ikigai-compress.workspace = true
# "Exploring without Rust": the recorded week of USGS earthquakes, at
# `urn:file:quakes-2024-01-01.geojson`, the name the CLI's file workspace gives the same file.
# The page has no file system, so this name is an atom with the bytes compiled in, and so is
# `urn:file:quakes.context.jsonld` ("Giving the data names"); nothing else under `urn:file:` is
# bound here. Its chapters read them with `urn:json:query` (bound above) and `urn:sparql:select`.
quakes = { path = "../quakes" }
# "Giving the data names": the quakes context makes the recorded week a graph, and the chapter
# asks it SPARQL: ikigai-rdf (`urn:rdf:transrept`) and ikigai-sparql (`urn:sparql:*`, oxigraph's
# in-memory store), both from ikigai-linkeddata. Each reads JSON-LD itself (oxjsonld, with no
# network loader, which is why the chapter's template puts the context inline). They build for
# wasm32-unknown-unknown as they are, and they are the page's largest addition: the release
# kernel grew from 9,603,302 to 13,808,431 bytes (gzip -9: 1,968,325 to 2,738,628), measured
# 2026-10-29 with the workspace's release profile. ikigai-jsonld (`urn:jsonld:expand`,
# `:compact`, …) is NOT linked: no cell uses it, and it would add 1,428,313 bytes more (gzip -9:
# 304,631), on every page that has a cell. Add it with the first cell that does.
ikigai-rdf.workspace = true
ikigai-sparql.workspace = true
# `TurtleRenderer`, now that the page builds its own kernel rather than taking
# `hello_camel::kernel()` whole: the same renderer that one injects.
ikigai-vocab.workspace = true
# The CLI's renderer-agnostic engine: the REPL grammar (`source a | b`, `cache`, `trace`,
# `describe … text/turtle`) over any `Resolver`. Wasm-clean — ikigai-web-demo has driven
# it in the browser since 0.1.4 — and `eval_async` is what lets a cell run on the JS event
# loop rather than block the page. 0.1.29 is the floor because the spreadsheet's part VI uses
# what it added: `as-of=<instant>` on a line, which resolves the line in a temporal corridor
# built from doors the host supplies (`Engine::with_as_of_doors`), and hands the resolver that
# line's chain (`Resolver::issue_as_async_in`). 0.1.63 is the pin (set 2026-10-14); the workspace
# locks every cli crate at one version, so this one follows. The ikigai Book's REPL transcripts
# replay `ikigai` 0.2.5 (`books/ikigai/ikigai-cli.version`, moved from 0.1.64 on 2026-10-29,
# ledger #2554), which links core 0.2.6 and engine 0.2.5 while the cells link core 0.2.2 and
# engine 0.2.1, so the replay cli is now AHEAD of the cells rather than behind them. 0.1.63 changed the engine in one place: a typed `MissingArgument` or `InvalidArgument`
# keeps its first line and gains the argument's contract beneath it, read from the target's JSON
# `Meta`, with "pipe a value in or pass name=…" when a pipe or positional value would fill it
# (ledger #1499). (The gonk Book's pinned gonk links 0.1.61. 0.1.62 changed
# the engine in three places: a fan-out branch that panics or answers nothing is that branch's error
# (ledger #85), `cap` refuses a word that is not a capability scope (ledger #105), and a target whose
# contract could not be read says so (ledger #98); 0.1.57 to 0.1.61 changed doors and paths, not the
# engine. 0.1.56 changed
# no engine code: a QUIC client pings, so a vanished peer is found in seconds, and a QUIC door
# resolves off its runtime worker. 0.1.53 to 0.1.55 changed the engine only in where a piped
# value goes: a content-less `delete` takes one into a declared `content`, a `source` value is
# routed among the Source action's own arguments, and a stdin known to be empty is no value. No
# cell pipes into a `delete` or a per-verb source.)
# 0.2.1 is the pin (set 2026-10-27, ledger #2365, the core 0.2.0 sweep): the newest release, and
# one on ikigai-core 0.2, the streams release (ledger #2261); the old pin "0.1.63" was a ceiling
# below 0.2.0 that held it on core 0.1. A 0.x caret: also a ceiling (<0.3.0).
# 0.2's plain `trace` leaves out the kernel's `defaulted` notes; `trace --defaults` prints them,
# which "A space that changes while it runs" asks for under its view.
ikigai-engine = "0.2.1"
# The `Resolver` seam the engine drives, implemented here by `InChain` so a cell can run in
# one chain (a game's, a person's scenario) on the page's kernel. 0.1.29 matches the engine:
# it is where `issue_as_async_in` and `is_cached_in` arrived, which `InChain` overrides to
# stack the line's chain inside its own (`Scope::stack`, core 0.1.82). 0.1.63 is the pin, with
# the engine.
# 0.2.1 is the pin (set 2026-10-27, ledger #2365, the core 0.2.0 sweep): the newest release, and
# one on ikigai-core 0.2, the streams release (ledger #2261); the old pin "0.1.63" was a ceiling
# below 0.2.0 that held it on core 0.1. A 0.x caret: also a ceiling (<0.3.0).
ikigai-resolve = "0.2.1"
# The trait is an `#[async_trait]`, so its implementor needs the macro.
async-trait = "0.1"
# `block_on` for the trait's one synchronous method, as the kernel's own impl does.
futures.workspace = true
serde_json = "1"
# Pinned exactly, and the SAME version is pinned for wasm-bindgen-cli in pages.yml: the
# generated JS and the compiled wasm must agree on their ABI, and a mismatch is a runtime
# failure in the page, not a build error anywhere a gate would see it.
wasm-bindgen = "=0.2.108"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
console_error_panic_hook = "0.1"

[dev-dependencies]
# Tic-tac-toe's part VII: its page test prints the file's arrangement the way the build
# resource does, to check the cell's answer is the file and not a copy of it.
ikigai-sexpr.workspace = true
# The stages viewer's native check (`book_transcripts::stages`), shared with the architecture
# book's: "A space that changes while it runs" commits its stages, and a test holds them to the
# live host.
book-transcripts = { path = "../book-transcripts" }
