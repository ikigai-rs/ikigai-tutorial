[package]
name = "book-wasm"
version = "0.1.0"
description = "The book's own kernel, in the page: a wasm-bindgen face over the book's spaces (Part I and the tic-tac-toe game) and the CLI's engine, so a chapter's runnable cells resolve for real."
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
publish = false

[lib]
name = "book_wasm"
path = "src/lib.rs"
# `cdylib` is the wasm; `rlib` keeps the crate buildable, lintable and testable natively,
# so the workspace gates see it like any other crate.
crate-type = ["cdylib", "rlib"]

[dependencies]
ikigai-core.workspace = true
# Part I's space and host — the same `kernel()` the chapter's tests run against, so a
# cell in the page and a listing in the crate answer the same question the same way.
hello-camel = { path = "../hello-camel" }
# The applied chapter's game (tic-tac-toe), composed beside Part I's space in ONE page
# kernel — see `page_space()`. Its names do not overlap Part I's, so every existing cell
# answers exactly as it did.
tic-tac-toe = { path = "../tic-tac-toe" }
# "Time is a resource": the clock, the date, events and countdowns. Its names do not
# overlap either family above. They answer only on a page whose kernel has a clock
# (`useClock`), and refuse, saying so, everywhere else.
time-resource = { path = "../time-resource" }
# The spreadsheet arc: inputs, compiled formulas, values, the grid. `urn:iki:tutorial:sheet:*`
# overlaps nothing above. Its grid view composes through `urn:iki:fn:compose`, which Part
# I's space already binds on the page.
spreadsheet = { path = "../spreadsheet" }
# `TurtleRenderer`, now that the page builds its own kernel rather than taking
# `hello_camel::kernel()` whole: the same renderer that one injects.
ikigai-vocab.workspace = true
# The CLI's renderer-agnostic engine: the REPL grammar (`source a | b`, `cache`, `trace`,
# `describe … text/turtle`) over any `Resolver`. Wasm-clean — ikigai-web-demo has driven
# it in the browser since 0.1.4 — and `eval_async` is what lets a cell run on the JS event
# loop rather than block the page. 0.1.29 is the floor because the spreadsheet's part VI uses
# what it added: `as-of=<instant>` on a line, which resolves the line in a temporal corridor
# built from doors the host supplies (`Engine::with_as_of_doors`), and hands the resolver that
# line's chain (`Resolver::issue_as_async_in`).
ikigai-engine = "0.1.29"
# The `Resolver` seam the engine drives, implemented here by `InChain` so a cell can run in
# one chain (a game's, a person's scenario) on the page's kernel. 0.1.29 matches the engine:
# it is where `issue_as_async_in` and `is_cached_in` arrived, which `InChain` overrides to
# stack the line's chain inside its own (`Scope::stack`, core 0.1.82).
ikigai-resolve = "0.1.29"
# The trait is an `#[async_trait]`, so its implementor needs the macro.
async-trait = "0.1"
# `block_on` for the trait's one synchronous method, as the kernel's own impl does.
futures.workspace = true
serde_json = "1"
# Pinned exactly, and the SAME version is pinned for wasm-bindgen-cli in pages.yml: the
# generated JS and the compiled wasm must agree on their ABI, and a mismatch is a runtime
# failure in the page, not a build error anywhere a gate would see it.
wasm-bindgen = "=0.2.108"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
console_error_panic_hook = "0.1"
