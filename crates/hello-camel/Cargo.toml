[package]
name = "hello-camel"
version = "0.1.0"
description = "The code taught by Part I of the ikigai tutorial: the camel-case endpoint and a minimal host."
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
publish = false

[lib]
name = "hello_camel"
path = "src/lib.rs"

[[bin]]
name = "tutorial"
path = "src/bin/tutorial.rs"

[dependencies]
ikigai-core.workspace = true
ikigai-vocab.workspace = true
ikigai-fn.workspace = true
futures.workspace = true

[dev-dependencies]
# The scanner behind tests/book_runs.rs: dependency-free, so no cycle (ledger #1072).
book-transcripts = { path = "../book-transcripts" }
