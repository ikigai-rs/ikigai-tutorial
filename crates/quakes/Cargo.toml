[package]
name = "quakes"
version = "0.1.0"
description = "The recorded window \"Exploring without Rust\" runs on: one week of USGS earthquakes (2024-01-01 to 2024-01-08, M4.5 and up, 178 events) as GeoJSON, bound at urn:file:quakes-2024-01-01.geojson so the page's kernel reads the same name the CLI's file workspace does; and urn:quakes:template:headline, a template its $j markers fill."
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
publish = false

[lib]
name = "quakes"
path = "src/lib.rs"

# Compiled into the page (`crates/book-wasm`), so it stays wasm-clean: the window is
# `include_bytes!`, never read from a file system at run time.
[dependencies]
ikigai-core.workspace = true

[dev-dependencies]
futures.workspace = true
serde_json = "1"
