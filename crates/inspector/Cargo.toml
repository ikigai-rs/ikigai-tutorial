[package]
name = "inspector"
version = "0.1.0"
description = "The model and artifacts of the kernel inspector, the demo app of Building ikigai UIs: XSLT graph views over the kernel's own resources, composed into pages by ikigai-ui, compiled in or read from a directory under the same names."
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
publish = false

[lib]
name = "inspector"
path = "src/lib.rs"

[dependencies]
ikigai-core.workspace = true
ikigai-vocab.workspace = true
# 0.6.0, not the workspace's 0.5 line: the data views fill their row template with
# `urn:iki:fn:each` (ledger #1800), which 0.6.0 added. A 0.x caret (<0.7.0); ikigai-ui 0.1.0 keeps
# its own 0.5 copy, which is fine, since the two meet only as resources.
ikigai-fn = "0.6.0"
ikigai-ui = "0.1.0"
ikigai-xslt = "0.3.1"
ikigai-rdf = "0.2.5"
futures.workspace = true
# The graph a view transforms gets the links a page needs added as data (XSLT 1.0 cannot
# percent-encode): parsed and written back as Turtle with the workspace's own RDF crates.
oxttl.workspace = true
oxrdf.workspace = true
# Decoding, never by hand (field guide: do not reimplement common behavior): a detail name
# that arrives as one percent-encoded segment, and a browser form's urlencoded body.
percent-encoding = "2.3"
form_urlencoded = "1.2"
# The data views read CSV as JSON through ikigai-json: `urn:json:query` over the CSV atom plans
# its registered text/csv -> application/json transreptor (`urn:json:from-csv`). 0.1.0 is the
# first release and the floor; a 0.x caret (<0.2.0).
ikigai-json = "0.1.0"

[dev-dependencies]
# The UI test kit (UI conventions D18): snapshots, the contrast floor, the token lints and the
# static site axe runs over. 0.1.0 is the first release and the floor; a 0.x caret (<0.2.0).
ikigai-ui = { version = "0.1.0", features = ["testkit"] }
# The directory delivery, for real, in the two-deliveries test (never in the page: ikigai-fs
# reads a disk). The release ikigai-ui's own tests use; a 0.x caret (<0.2.0).
ikigai-fs = "0.1.9"
