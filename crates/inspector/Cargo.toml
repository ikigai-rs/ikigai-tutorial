[package]
name = "inspector"
version = "0.1.0"
description = "The model and artifacts of the kernel inspector, the demo app of Building ikigai UIs: XSLT graph views over the kernel's own resources, composed into pages by ikigai-ui, compiled in or read from a directory under the same names."
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
publish = false

[lib]
name = "inspector"
path = "src/lib.rs"

[dependencies]
ikigai-core.workspace = true
ikigai-vocab.workspace = true
# 0.6.0, not the workspace's 0.5 line: the data views fill their row template with
# `urn:iki:fn:each` (ledger #1800), which 0.6.0 added. A 0.x caret (<0.7.0); ikigai-ui 0.1.0 keeps
# its own 0.5 copy, which is fine, since the two meet only as resources.
# 0.7.0 is the pin (set 2026-10-27, ledger #2365, the core 0.2.0 sweep): the newest release, and
# one on ikigai-core 0.2, the streams release (ledger #2261); the old pin "0.6.0" was a ceiling
# below 0.7.0 that held it on core 0.1. A 0.x caret: also a ceiling (<0.8.0).
ikigai-fn = "0.7.0"
# 0.3.0 is the pin (set 2026-10-27, ledger #2365, the core 0.2.0 sweep): the newest release, and
# one on ikigai-core 0.2, the streams release (ledger #2261); the old pin "0.1.0" was a ceiling
# below 0.2.0 that held it on core 0.1. A 0.x caret: also a ceiling (<0.4.0).
# 0.3's page shell splices a family's head additions from `urn:iki:ui:head:{family}`, one more
# door and one more cache entry, which the committed snapshots show.
ikigai-ui = "0.3.0"
# 0.4.0 is the pin (set 2026-10-27, ledger #2365, the core 0.2.0 sweep): the newest release, and
# one on ikigai-core 0.2, the streams release (ledger #2261); the old pin "0.3.1" was a ceiling
# below 0.4.0 that held it on core 0.1. A 0.x caret: also a ceiling (<0.5.0).
ikigai-xslt = "0.4.0"
# 0.3.1 is the pin (set 2026-10-27, ledger #2365, the core 0.2.0 sweep): the newest release, and
# one on ikigai-core 0.2, the streams release (ledger #2261); the old pin "0.2.5" was a ceiling
# below 0.3.0 that held it on core 0.1. A 0.x caret: also a ceiling (<0.4.0).
ikigai-rdf = "0.3.1"
futures.workspace = true
# The graph a view transforms gets the links a page needs added as data (XSLT 1.0 cannot
# percent-encode): parsed and written back as Turtle with the workspace's own RDF crates.
oxttl.workspace = true
oxrdf.workspace = true
# Decoding, never by hand (field guide: do not reimplement common behavior): a detail name
# that arrives as one percent-encoded segment, and a browser form's urlencoded body.
percent-encoding = "2.3"
form_urlencoded = "1.2"
# The data views read CSV as JSON through ikigai-json: `urn:json:query` over the CSV atom plans
# its registered text/csv -> application/json transreptor (`urn:json:from-csv`). 0.1.0 is the
# first release and the floor; a 0.x caret (<0.2.0).
# 0.3.1 is the pin (set 2026-10-27, ledger #2365, the core 0.2.0 sweep): the newest release, and
# one on ikigai-core 0.2, the streams release (ledger #2261); the old pin "0.1.0" was a ceiling
# below 0.2.0 that held it on core 0.1. A 0.x caret: also a ceiling (<0.4.0).
ikigai-json = "0.3.1"

[dev-dependencies]
# The UI test kit (UI conventions D18): snapshots, the contrast floor, the token lints and the
# static site axe runs over. 0.1.0 is the first release and the floor; a 0.x caret (<0.2.0).
# 0.3.0 is the pin (set 2026-10-27, ledger #2365, the core 0.2.0 sweep): the newest release, and
# one on ikigai-core 0.2, the streams release (ledger #2261); the old pin "0.1.0" was a ceiling
# below 0.2.0 that held it on core 0.1. A 0.x caret: also a ceiling (<0.4.0).
ikigai-ui = { version = "0.3.0", features = ["testkit"] }
# The directory delivery, for real, in the two-deliveries test (never in the page: ikigai-fs
# reads a disk). The release ikigai-ui's own tests use; a 0.x caret (<0.2.0).
# 0.2.2 is the pin (set 2026-10-27, ledger #2365, the core 0.2.0 sweep): the newest release, and
# one on ikigai-core 0.2, the streams release (ledger #2261); the old pin "0.1.9" was a ceiling
# below 0.2.0 that held it on core 0.1. A 0.x caret: also a ceiling (<0.3.0).
ikigai-fs = "0.2.2"
