<!doctype html>
<html lang="en" data-theme="auto">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="htmx-config" content='{"allowEval":false,"allowScriptTags":false,"includeIndicatorStyles":false,"historyCacheSize":10,"refreshOnHistoryMiss":true}'>
<title>A note to watch · Inspector</title>
<link rel="stylesheet" href="/ui/tokens.css">
<script src="/ui/shell.js"></script>
<script src="/ui/htmx" integrity="sha384-HGfztofotfshcF7+8n44JQL2oJmowVChPTg48S+jvZoztPfvwD79OC/LTtG6dMp+" defer></script>
</head>
<body>
<a class="ui-skip" href="#main">Skip to content</a>
<header>
<link rel="stylesheet" href="/inspect/inspector.css">
<nav aria-label="Inspector">
<a href="/inspect/cache" hx-get="/inspect/fragment/cache" hx-target="#main" hx-push-url="/inspect/cache">Cache</a>
<a href="/inspect/threads" hx-get="/inspect/fragment/threads" hx-target="#main" hx-push-url="/inspect/threads">Threads</a>
<a href="/inspect/topology" hx-get="/inspect/fragment/topology" hx-target="#main" hx-push-url="/inspect/topology">Topology</a>
<a href="/inspect/catalog" hx-get="/inspect/fragment/catalog" hx-target="#main" hx-push-url="/inspect/catalog">Catalog</a>
<a href="/inspect/scheduler" hx-get="/inspect/fragment/scheduler" hx-target="#main" hx-push-url="/inspect/scheduler">Scheduler</a>
<a href="/inspect/note" hx-get="/inspect/fragment/note" hx-target="#main" hx-push-url="/inspect/note">Note</a>
</nav>
<script src="/inspect/live.js" defer></script>

</header>
<div id="status" role="status" aria-live="polite"></div>
<main id="main" tabindex="-1">
<section id="view" class="inspect">
<h1>A note to watch</h1>
<p>Writing the note cuts its golden thread. Open the cache view in another tab and watch the card's entry turn <code>cut</code>.</p>
<div id="note-card" class="inspect-card" hx-get="/inspect/card" hx-trigger="ikigai:cut from:body" hx-swap="outerHTML" data-ui-quiet="">
<p>Write me, then watch the cache.</p>
</div>

<form method="post" action="/inspect/note/write" hx-post="/inspect/note/write" hx-swap="none">
<label for="note-text">The note</label>
<textarea id="note-text" name="content" rows="3" maxlength="4096" required></textarea>
<button type="submit">Write it</button>
</form>
</section>

</main>
</body>
</html>
