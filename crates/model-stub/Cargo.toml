[package]
name = "model-stub"
version = "0.1.0"
description = "A deterministic urn:llm: peer for The gonk Book's transcripts: urn:llm:ask and urn:llm:config served over a Unix socket, answering each ask with a canned SPARQL draft (or, for browse's explain, review and judge asks, a canned explanation, review or verdict, also at urn:llm:coder:ask), so a scratch gonk mounts a model and drafts, explains and reviews without any network or real model."
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
publish = false

[lib]
name = "model_stub"
path = "src/lib.rs"

[[bin]]
name = "model-stub"
path = "src/main.rs"

[dependencies]
ikigai-core.workspace = true
# The Meta renderer, so a mount describes this peer's contracts the way a real one does.
ikigai-vocab.workspace = true
# The socket door a `gonk.mount = "prefer urn:llm:=<socket>"` line dials. 0.1.63, as
# `crates/two-hosts` takes (set 2026-10-14). The pinned gonk links 0.1.61, and neither 0.1.62 nor
# 0.1.63 changed a Unix-socket wire (0.1.62's changes are engine, MCP, tz and key-file fixes; 0.1.63
# touched only the engine, the embedded host, tz and the intray, and no transport crate's source),
# so the stub and gonk speak one protocol.
# 0.2.1 is the pin (set 2026-10-27, ledger #2365, the core 0.2.0 sweep): the newest release, and
# one on ikigai-core 0.2, the streams release (ledger #2261); the old pin "0.1.63" was a ceiling
# below 0.2.0 that held it on core 0.1. A 0.x caret: also a ceiling (<0.3.0). It speaks wire v10
# and still serves v7 to v9 at the version a peer's hello names (`ikigai_wire::MIN_PROTOCOL_VERSION`),
# so the pinned gonk's older client and this stub still agree on one protocol.
ikigai-ipc = "0.2.1"
async-trait = "0.1"
serde_json.workspace = true
