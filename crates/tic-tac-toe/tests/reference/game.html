<section class="ttt-game" aria-label="Game {{game}}">
<p class="ttt-status" role="status" hx-get="iki/tutorial/ttt/view/status" hx-trigger="load"></p>
<div class="ttt-board" hx-get="iki/tutorial/ttt/view/board" hx-trigger="htmx:afterSettle from:previous .ttt-status"></div>
<button type="button" class="ttt-reset" hx-post="iki/tutorial/ttt/view/reset" hx-target="previous .ttt-status">New game</button>
</section>
