[package]
name = "ui-book-wasm"
version = "0.1.0"
description = "Building ikigai UIs' own kernel, in the page: a wasm-bindgen face over the kernel inspector (crates/inspector) and the CLI's engine, so a chapter's cells read the inspector's views and write its note for real."
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
publish = false

[lib]
name = "ui_book_wasm"
path = "src/lib.rs"
crate-type = ["cdylib", "rlib"]

[dependencies]
ikigai-core.workspace = true
inspector = { path = "../inspector" }
# The CLI's engine, as crates/book-wasm and crates/gonk-book-wasm take it: the same REPL grammar
# a reader types at `ikigai`. 0.1.63, with them.
ikigai-engine = "0.1.63"
futures.workspace = true
serde_json = "1"
# ⚠ Pinned EXACTLY, to the version crates/book-wasm pins and pages.yml installs the
# `wasm-bindgen-cli` for. Bump all of them or none.
wasm-bindgen = "=0.2.108"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
console_error_panic_hook = "0.1"

[dev-dependencies]
# The matcher the transcript gate uses, so a cell's expected output can say `…` where an id is
# minted.
book-transcripts = { path = "../book-transcripts" }
