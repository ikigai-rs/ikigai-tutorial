[book]
title = "Building ikigai UIs"
authors = ["Brian Sletten"]
language = "en"
src = "src"

[output.html]
default-theme = "rust"
# The third book of this repository, published beside the other two: The ikigai Book is the
# site's root (https://ikigai-rs.github.io/ikigai-tutorial/), The gonk Book is at `gonk/`, and
# this one is at `ui/`. `scripts/assemble-site.sh` reads this value to place the built book, and
# the 404 page finds its assets from it.
site-url = "/ikigai-tutorial/ui/"
git-repository-url = "https://github.com/ikigai-rs/ikigai-tutorial"
edit-url-template = "https://github.com/ikigai-rs/ikigai-tutorial/edit/main/books/ui/{path}"
# The SAME files as The ikigai Book's, by symlink: one contrast repair and one runnable-cell
# script for every book. `crates/book-a11y` measures the cascade this book really loads.
additional-css = ["css/a11y.css", "css/layout.css", "css/run.css"]
# run.js loads `wasm/book_wasm.js` beside this book's root: for this book that is
# `crates/ui-book-wasm`, the kernel inspector the book builds, bound under the same file name.
additional-js = ["js/a11y.js", "js/run.js"]

[output.html.fold]
enable = true
level = 1

[rust]
edition = "2021"
