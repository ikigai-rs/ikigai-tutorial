# What's new in Building ikigai UIs: one entry per change a reader would notice, NEWEST FIRST.
#
# `crates/book-whats-new` writes src/whats-new.md from this file (./scripts/test-books.sh runs it
# before `mdbook build`), and a test fails when the two disagree. A change to this book's pages
# that adds or updates no entry here is refused in CI, with the entry to add.
#
#   date        "YYYY-MM-DD"
#   summary     one or two sentences, at most 60 words, for a READER: what they will now find
#               (not the commit subject); check-diff checks new summary text, not past entries
#               Words split on whitespace; sentence endings are . ! ? before whitespace/end
#               (after closing quotes/delimiters); a final unpunctuated fragment counts too
#   pages       the pages to read for it, as SUMMARY.md links them; titles come from SUMMARY.md
#   removed     titles of pages that no longer exist, listed without a link (optional)
#   maintenance true for upkeep with no news in it (a version move, a link or typo fix): kept
#               here, left off the page (optional)
#   commit      the commit an entry was written from; for tooling only, never shown (optional)
#
# A chapter that is still a stub gets no entry; it gets one when it is written.

[[change]]
date = "2026-10-30"
summary = "The delivery targets now lead with their technology: \"htmx\", \"GPUI\", \"WebAssembly\", \"WebTransport\" and \"Text: in the terminal\". Two headings in the views chapters now name their subject: \"Other forms of data\" and \"When a graph helps\"."
pages = ["delivery/htmx.md", "delivery/gpui.md", "delivery/wasm.md", "delivery/webtransport.md", "delivery/terminal.md", "model/views-from-csv.md", "model/views-from-json.md"]

