<rect class="ikd-t-endpoints" x="49" y="361" width="878" height="46" rx="3"/>
<text x="56" y="378"><tspan class="ikd-m">layer 3 · </tspan><tspan class="ikd-x ikd-b">Endpoints</tspan><tspan class="ikd-x">  2 doors tried in order; the first match wins</tspan></text>
<text x="56" y="398"><tspan class="ikd-m">urn:iki:space:tutorial:harness:board</tspan></text>
