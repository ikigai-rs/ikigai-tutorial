<svg xmlns="http://www.w3.org/2000/svg" xml:lang="en" lang="en" width="960" height="740" viewBox="0 0 960 740" role="group" aria-labelledby="ikds-cca5b5c72bb0c5ea-title" class="ikd">
<title id="ikds-cca5b5c72bb0c5ea-title">Resolution arrangement: urn:ikigai:chain:root, with governor state</title>
<desc id="ikds-cca5b5c72bb0c5ea-desc">The resolution chain one request sees: the root alone. In all: 1 fallback; and 10 doors across 4 endpoint spaces. Named spaces, in the order drawn: urn:iki:space:tutorial:harness:governed, urn:iki:space:tutorial:harness:upstream, urn:iki:space:tutorial:harness:board, urn:iki:space:diagram. Over it, the state of 1 governor, drawn in the box of each space governed and stated in words below the picture.</desc>
<style>.ikd{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace;font-size:13px}.ikd-b{font-weight:700}.ikd-hole{stroke-dasharray:6 4}.ikd-dim{stroke-dasharray:2 3}.ikd-bg{fill:#ffffff}.ikd-box{fill:#ffffff}.ikd-x{fill:#1f2328}.ikd-m{fill:#59636e}.ikd-k-chain{stroke:#59636e}.ikd-t-chain{fill:#f6f8fa}.ikd-k-fallback{stroke:#0969da}.ikd-t-fallback{fill:#ddf4ff}.ikd-k-mount{stroke:#1a7f37}.ikd-t-mount{fill:#dafbe1}.ikd-k-dynamic{stroke:#1a7f37}.ikd-t-dynamic{fill:#dafbe1}.ikd-k-alias{stroke:#8250df}.ikd-t-alias{fill:#fbefff}.ikd-k-limit{stroke:#cf222e}.ikd-t-limit{fill:#ffebe9}.ikd-k-level{stroke:#9a6700}.ikd-t-level{fill:#fff8c5}.ikd-k-endpoints{stroke:#1b7c83}.ikd-t-endpoints{fill:#dff7f5}.ikd-k-opaque{stroke:#818b98}.ikd-t-opaque{fill:#f6f8fa}.ikd-k-rewrite{stroke:#bc4c00}.ikd-t-rewrite{fill:#fff1e5}.ikd-k-confine{stroke:#953800}.ikd-t-confine{fill:#fff1e5}.ikd-k-unknown{stroke:#59636e}.ikd-t-unknown{fill:#f6f8fa}.ikd-k-problem{stroke:#cf222e}.ikd-t-problem{fill:#ffebe9}.ikd-mk-exact{fill:#59636e}.ikd-mk-template{fill:#0969da}.ikd-mk-prefix{fill:#1a7f37}.ikd-mk-custom{fill:#cf222e}.ikd-k-state{stroke:#bf3989}.ikd-t-state{fill:#ffeff7}.ikd-st-go{fill:#1a7f37}.ikd-st-wait{fill:#7d4e00}.ikd-st-stop{fill:#cf222e}.ikd-st-unknown{fill:#59636e}</style>
<rect class="ikd-bg" width="960" height="740"/>
<g role="img" aria-labelledby="ikds-cca5b5c72bb0c5ea-title ikds-cca5b5c72bb0c5ea-desc">
<g>
<rect class="ikd-box" x="16" y="16" width="928" height="600" rx="4"/>
<rect class="ikd-t-chain" x="17" y="17" width="926" height="46" rx="3"/>
<text x="24" y="34"><tspan class="ikd-x ikd-b">Chain</tspan><tspan class="ikd-x">  the caller&#39;s view: corridors innermost first, then the root</tspan></text>
<text x="24" y="54"><tspan class="ikd-m">urn:ikigai:chain:root</tspan></text>
<g>
<rect class="ikd-box" x="32" y="72" width="904" height="536" rx="4"/>
<rect class="ikd-t-fallback" x="33" y="73" width="902" height="26" rx="3"/>
<text x="40" y="90"><tspan class="ikd-m">root · </tspan><tspan class="ikd-x ikd-b">Fallback</tspan><tspan class="ikd-x">  4 layers consulted in order; the first hit wins</tspan></text>
<g>
<rect class="ikd-box" x="48" y="108" width="880" height="120" rx="4"/>
<rect class="ikd-t-endpoints" x="49" y="109" width="878" height="46" rx="3"/>
<text x="56" y="126"><tspan class="ikd-m">layer 1 · </tspan><tspan class="ikd-x ikd-b">Endpoints</tspan><tspan class="ikd-x">  1 door tried in order; the first match wins</tspan></text>
<text x="56" y="146"><tspan class="ikd-m">urn:iki:space:tutorial:harness:governed</tspan></text>
<rect class="ikd-t-state" x="52" y="160" width="872" height="20" rx="2"/>
<text x="56" y="174"><tspan class="ikd-m">governed by </tspan><tspan class="ikd-x ikd-b">circuit breaker</tspan><tspan class="ikd-x"> breaker</tspan><tspan class="ikd-m"> · trips after 3, cooldown 5s</tspan></text>
<text x="72" y="194"><tspan class="ikd-st-wait ikd-b">HALF-OPEN</tspan><tspan class="ikd-m"> circuit </tspan><tspan class="ikd-x">urn:iki:tutorial:harness:call</tspan><tspan class="ikd-m"> · </tspan><tspan class="ikd-x">3 consecutive transient failures</tspan></text>
