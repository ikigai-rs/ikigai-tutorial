<svg xmlns="http://www.w3.org/2000/svg" xml:lang="en" lang="en" width="960" height="1104" viewBox="0 0 960 1104" role="group" aria-labelledby="ikds-b2097e128a8c8974-title" class="ikd">
<title id="ikds-b2097e128a8c8974-title">Resolution arrangement: urn:ikigai:chain:root, with governor state</title>
<desc id="ikds-b2097e128a8c8974-desc">The resolution chain one request sees: the root alone. In all: 1 fallback, 1 opaque space; and 12 doors across 5 endpoint spaces. Named spaces, in the order drawn: urn:iki:space:tutorial:harness:governed, urn:iki:space:tutorial:harness:pool, urn:iki:space:tutorial:harness:upstream, urn:iki:space:tutorial:harness:board, urn:iki:space:diagram. Over it, the state of 3 governors, drawn in the box of each space governed and stated in words below the picture. What changed since an earlier board is marked after each state word, and stated first in the words.</desc>
