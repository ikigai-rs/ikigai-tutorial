summary = "\"One module, a boundary and a surface\" has a new section, \"Bodies larger than memory\": how the HTTP door of ikigai-cli 0.2.2 frames a streamed answer (Content-Length or chunked), serves byte ranges (206, 416, If-Range), spills uploads to disk under its 408 and 413 bounds, and why every ETag changed once."
pages = ["door/door.md"]

[[change]]
