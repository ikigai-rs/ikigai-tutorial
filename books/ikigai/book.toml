[book]
title = "The ikigai Book"
authors = ["Brian Sletten"]
language = "en"
src = "src"

[output.html]
default-theme = "rust"
# The book is published as a PROJECT Pages site (https://ikigai-rs.github.io/ikigai-tutorial/),
# so it lives under this prefix rather than at the domain root. Chapter-to-chapter links
# are relative and never needed it. The 404 page does: Pages serves it for ANY missing
# path under the site, at whatever depth the bad URL had, so its assets can only be found
# from an absolute base — this value becomes its `<base href>`. Nothing else in the
# output changes, which is why `mdbook serve` still serves at http://localhost:3000/
# (measured on mdbook 0.5.4: it ignores site-url; the prefixed path 404s locally).
site-url = "/ikigai-tutorial/"
git-repository-url = "https://github.com/ikigai-rs/ikigai-tutorial"
edit-url-template = "https://github.com/ikigai-rs/ikigai-tutorial/edit/main/books/ikigai/{path}"
# Loaded after mdbook's own palette, which is what lets the contrast repairs in that file
# win by cascade order rather than by forking the theme. `crates/book-a11y` measures the
# result and CI runs it — see scripts/test-books.sh.
additional-css = ["css/a11y.css", "css/run.css", "css/ttt.css", "css/view.css", "css/sheet.css"]
# run.js turns `<div class="ikigai-run" data-cmd='…'>` into a runnable cell backed by the
# book's own kernel (`crates/book-wasm`, built by pages.yml into `wasm/` beside this
# book's output). With the wasm absent the cell cannot run: Run is disabled, the result
# stays empty, and the listing's output stays behind its "Expected output" disclosure.
# ttt.js turns `<div class="ttt-play" data-game='…'>` into a playable board: the game's own
# htmx markup, with htmx's requests answered by that same kernel. It returns at once on a
# page with no board, and loads the vendored htmx (`src/vendor/`) only on one that has.
# view.js does the same for `<div class="ikigai-view" data-shell='…'>`, a view that polls
# (the clock in "Time is a resource"), with a pause and a count of what the polling cost.
# sheet.js does the same for `<div class="sheet-play" data-shell='…'>`, the spreadsheet arc's
# sheet: a grid and a formula bar whose form fields reach the kernel as named arguments.
additional-js = ["js/a11y.js", "js/run.js", "js/ttt.js", "js/view.js", "js/sheet.js"]

[output.html.fold]
enable = true
level = 1

[rust]
edition = "2021"
