<svg xmlns="http://www.w3.org/2000/svg" xml:lang="en" lang="en" width="960" height="212" viewBox="0 0 960 212" role="img" aria-labelledby="ikd-b054e2fc780b3a5b-title ikd-b054e2fc780b3a5b-desc" class="ikd">
<title id="ikd-b054e2fc780b3a5b-title">Space arrangement: urn:iki:space:dynamic:workshop</title>
<desc id="ikd-b054e2fc780b3a5b-desc">An arrangement whose outermost space is a dynamic space. In all: 1 dynamic space; and 4 doors across 1 endpoint space.</desc>
<style>.ikd{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace;font-size:13px}.ikd-b{font-weight:700}.ikd-hole{stroke-dasharray:6 4}.ikd-dim{stroke-dasharray:2 3}.ikd-bg{fill:#ffffff}.ikd-box{fill:#ffffff}.ikd-x{fill:#1f2328}.ikd-m{fill:#59636e}.ikd-k-chain{stroke:#59636e}.ikd-t-chain{fill:#f6f8fa}.ikd-k-fallback{stroke:#0969da}.ikd-t-fallback{fill:#ddf4ff}.ikd-k-mount{stroke:#1a7f37}.ikd-t-mount{fill:#dafbe1}.ikd-k-dynamic{stroke:#1a7f37}.ikd-t-dynamic{fill:#dafbe1}.ikd-k-alias{stroke:#8250df}.ikd-t-alias{fill:#fbefff}.ikd-k-limit{stroke:#cf222e}.ikd-t-limit{fill:#ffebe9}.ikd-k-level{stroke:#9a6700}.ikd-t-level{fill:#fff8c5}.ikd-k-endpoints{stroke:#1b7c83}.ikd-t-endpoints{fill:#dff7f5}.ikd-k-opaque{stroke:#818b98}.ikd-t-opaque{fill:#f6f8fa}.ikd-k-rewrite{stroke:#bc4c00}.ikd-t-rewrite{fill:#fff1e5}.ikd-k-confine{stroke:#953800}.ikd-t-confine{fill:#fff1e5}.ikd-k-unknown{stroke:#59636e}.ikd-t-unknown{fill:#f6f8fa}.ikd-k-problem{stroke:#cf222e}.ikd-t-problem{fill:#ffebe9}.ikd-mk-exact{fill:#59636e}.ikd-mk-template{fill:#0969da}.ikd-mk-prefix{fill:#1a7f37}.ikd-mk-custom{fill:#cf222e}</style>
<rect class="ikd-bg" width="960" height="212"/>
<g>
<rect class="ikd-box" x="16" y="16" width="928" height="180" rx="4"/>
<rect class="ikd-t-dynamic" x="17" y="17" width="926" height="46" rx="3"/>
<text x="24" y="34"><tspan class="ikd-x ikd-b">Dynamic space</tspan><tspan class="ikd-x">  urn:iki:tutorial:live:declaration</tspan></text>
<text x="24" y="54"><tspan class="ikd-m">urn:iki:space:dynamic:workshop</tspan></text>
<g>
<rect class="ikd-box" x="32" y="72" width="904" height="116" rx="4"/>
<rect class="ikd-t-endpoints" x="33" y="73" width="902" height="26" rx="3"/>
<text x="40" y="90"><tspan class="ikd-x ikd-b">Endpoints</tspan><tspan class="ikd-x">  4 doors tried in order; the first match wins</tspan></text>
<g><title>door 1: urn:iki:tutorial:camel-case (exact) is answered by camel-case</title>
<text x="40" y="118"><tspan class="ikd-m">1</tspan></text>
<text x="56" y="118"><tspan class="ikd-x">urn:iki:tutorial:camel-case</tspan></text>
<text x="288" y="118"><tspan class="ikd-m">→</tspan></text>
<text x="304" y="118"><tspan class="ikd-x ikd-b">camel-case</tspan></text>
<text x="400" y="118"><tspan class="ikd-mk-exact">exact</tspan></text>
</g>
<g><title>door 2: urn:iki:tutorial:title (exact) is answered by title</title>
<text x="40" y="138"><tspan class="ikd-m">2</tspan></text>
<text x="56" y="138"><tspan class="ikd-x">urn:iki:tutorial:title</tspan></text>
<text x="288" y="138"><tspan class="ikd-m">→</tspan></text>
<text x="304" y="138"><tspan class="ikd-x ikd-b">title</tspan></text>
<text x="400" y="138"><tspan class="ikd-mk-exact">exact</tspan></text>
</g>
<g><title>door 3: urn:iki:tutorial:camel-title (exact) is answered by camel-title</title>
<text x="40" y="158"><tspan class="ikd-m">3</tspan></text>
<text x="56" y="158"><tspan class="ikd-x">urn:iki:tutorial:camel-title</tspan></text>
<text x="288" y="158"><tspan class="ikd-m">→</tspan></text>
<text x="304" y="158"><tspan class="ikd-x ikd-b">camel-title</tspan></text>
<text x="400" y="158"><tspan class="ikd-mk-exact">exact</tspan></text>
</g>
<g><title>door 4: urn:iki:tutorial:upper (exact) is answered by toUpper</title>
<text x="40" y="178"><tspan class="ikd-m">4</tspan></text>
<text x="56" y="178"><tspan class="ikd-x">urn:iki:tutorial:upper</tspan></text>
<text x="288" y="178"><tspan class="ikd-m">→</tspan></text>
<text x="304" y="178"><tspan class="ikd-x ikd-b">toUpper</tspan></text>
<text x="400" y="178"><tspan class="ikd-mk-exact">exact</tspan></text>
</g>
<rect class="ikd-k-endpoints" x="32" y="72" width="904" height="116" rx="4" fill="none" stroke-width="1.5"/>
</g>
<rect class="ikd-k-dynamic" x="16" y="16" width="928" height="180" rx="4" fill="none" stroke-width="1.5"/>
</g>
</svg>
