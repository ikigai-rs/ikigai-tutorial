pages = ["applied/live-space.md"]

[[change]]
date = "2026-10-26"
summary = "The stages of \"A space that changes while it runs\" now hold still: below the tabs, the open stage's picture sits beside the stage before it, Before and After, with what changed from one to the other in words. \"Compare with\" puts any earlier stage in Before. Each picture is the one your kernel drew if that tab's step ran, or the chapter's own, said so, in a dashed frame. On a phone the two stack; long commands and answers scroll sideways instead of wrapping, and on a wide screen the page widens so the longest command fits on one line. The arrow keys on the tabs now move between tabs only; they used to open the next or previous chapter as well."
pages = ["applied/live-space.md"]

[[change]]
