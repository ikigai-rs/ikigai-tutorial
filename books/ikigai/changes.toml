# What's new in The ikigai Book: one entry per change a reader would notice, NEWEST FIRST.
#
# `crates/book-whats-new` writes src/whats-new.md from this file (./scripts/test-books.sh runs it
# before `mdbook build`), and a test fails when the two disagree. A change to this book's pages
# that adds or updates no entry here is refused in CI, with the entry to add.
#
#   date        "YYYY-MM-DD"
#   summary     one or two sentences for a READER: what they will now find (not the commit subject)
#   pages       the pages to read for it, as SUMMARY.md links them; titles come from SUMMARY.md
#   removed     titles of pages that no longer exist, listed without a link (optional)
#   maintenance true for upkeep with no news in it (a version move, a link or typo fix): kept
#               here, left off the page (optional)
#   commit      the commit an entry was written from; for tooling only, never shown (optional)
#
# A page that moves: update its path in every entry that names it (the check says which).
# The entries before 2026-10-15 were written from the repository's history, one per change.

[[change]]
date = "2026-10-28"
summary = "\"Somebody else's resource\" now says why its live steps run in your REPL rather than in the page: the page could fetch the feed, but every Run cell is checked against a fixed answer, and a feed that changes every minute never matches."
pages = ["explore/http.md"]

[[change]]
date = "2026-10-28"
summary = "The introduction defines the kernel's basic terms before using them, points to the companion books without a stale count, and distinguishes runnable Rust examples from ignored fragments. The front door names Cargo as an installation prerequisite and defines REPL, RDF, and capability; the grammar explains its syntax markers and acknowledges a REPL still open from the CLI chapter. The CLI chapter also includes the uncacheable status printed after cache and thread listings in CLI 0.2.4 and no longer understates the catalog's length."
pages = ["introduction.md", "front-door/cli.md", "front-door/grammar.md"]

[[change]]
date = "2026-10-28"
summary = "A new part, \"Exploring without Rust\", after the front door: no endpoints to write, only the `ikigai` command, the Run buttons and files, over a week of USGS earthquakes. \"A week of earthquakes\" introduces it; \"A lab with names in it\" asks the recorded week questions with a pipe, a map and a fork, and traces, caches and cuts them; \"Somebody else's resource\" reads the live feed through `urn:http:get`, keeps it for USGS's sixty seconds, cuts the URL's thread and narrows the session to one host; \"Reshaping JSON with jq\" asks sharper questions with `urn:json:query` and fills a headline template with `$j`. The page's kernel now also holds that headline template, which the `list` in \"The REPL grammar\" shows."
pages = ["explore/index.md", "explore/lab.md", "explore/http.md", "explore/jq.md", "front-door/grammar.md"]

[[change]]
date = "2026-10-28"
summary = "The page's kernel now holds one recorded file: a week of USGS earthquakes (178 events of M4.5 and up, 2024-01-01 to 2024-01-08) at `urn:file:quakes-2024-01-01.geojson`, the same name the CLI's file workspace gives a copy you save there. \"The kernel in the browser\" shows it in a new section, \"One recorded file\", where jq counts its events, and the `list` in \"The REPL grammar\" ends with it."
pages = ["browser.md", "front-door/grammar.md"]

[[change]]
date = "2026-10-28"
summary = "The two front-door chapters now distinguish shell commands, REPL input, and expected output. Pipe examples visibly reverse a list, and the grammar explains named arguments, newlines, example namespaces, and fan-out reporting. Composition now shows the template before its result and passes a caller-supplied greeting to `compose` by name, and a misspelled argument name is shown as the error it is since CLI 0.2.4."
pages = ["front-door/cli.md", "front-door/grammar.md"]

[[change]]
date = "2026-10-28"
summary = "Four pages now say what the streams releases changed. \"The REPL grammar\" says when a pipe hands the next stage a body instead of a value (ikigai-engine 0.2.2), and that a stored plan still pipes by value. \"Golden threads in practice\" and \"Twenty minutes, nothing compiled\" say what the cache bound counts now: a one-shot body is never stored, a spilled one counts its full length, and a hit shares its bytes. \"The file workspace\" ends with files as bodies (ikigai-fs 0.2.3): seekable reads, a validator for ETag and ranges, sinks that stream, and the 64 MiB write ceiling per root."
pages = ["front-door/grammar.md", "getting-started/golden-threads.md", "front-door/cli.md", "getting-started/file-workspace.md"]

[[change]]
date = "2026-10-27"
summary = "The book now builds against ikigai-core 0.2, the streams release, and every module it links moved with it. In \"Tic-tac-toe, V\", a game over a store in another process now caches nothing in the host: each read asks the store again, so a mark another client writes there is on the next board, and the store contract is run against the store's own answers. Status names core 0.2.2 and ikigai-module 0.5.1 and says what 0.2.0 changed. A plain `trace` no longer prints `defaulted=`; \"A space that changes while it runs\" asks for it with `trace --defaults`. The `list` in \"The REPL grammar\" shows the toolbox's new `urn:toolbox:path:{rest}`, and the grounding in \"A sentence becomes a draft\" counts 252 vocabulary terms."
pages = ["applied/tic-tac-toe-5.md", "modules/status.md", "applied/live-space.md", "front-door/grammar.md", "code/sentence.md"]

