# fmt · clippy · test for the code, and a separate job that builds and TESTS the book.
name: ci

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2

      - name: fmt
        run: cargo fmt --all -- --check

      - name: clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: test
        run: cargo test --all-targets

  # ── The book is a gate, not an artifact ──────────────────────────────────────
  #
  # `mdbook test` compiles and runs every Rust block in the book against the real
  # crate, which is the whole reason the tutorial is trustworthy: an example that
  # stops matching the API fails the build instead of misleading a reader.
  #
  # ⚠ This is a SEPARATE job from `check` on purpose, and the reason is not tidiness.
  # `mdbook test` needs `-L target/debug/deps` to find the dependencies, and rustc
  # refuses (E0464) when that directory holds more than one candidate for a crate.
  # `cargo clippy` emits `.rmeta` beside `cargo build`'s `.rlib`, so running them in
  # one job leaves two candidates for `ikigai_core` and every example fails to compile
  # with an error that says nothing about the book. A job that only builds keeps
  # `deps/` unambiguous.
  book:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: mdbook

      - name: build the crate the book includes from
        run: cargo build

      - name: build the book
        run: mdbook build books/getting-started

      - name: test the book (every example is compiled and run)
        run: mdbook test books/getting-started -L target/debug/deps
