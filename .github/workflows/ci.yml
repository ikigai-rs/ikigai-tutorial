name: ci
on:
  push: { branches: [main] }
  pull_request:
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}   # never cancel main
jobs:
  ci:
    uses: ikigai-rs/.github/.github/workflows/rust.yml@main
    with:
      test-args: "--all-targets"
      wasm-lib: true

      wasm-packages: book-wasm   # the one wasm face; two-hosts (quinn/mio) cannot build on wasm32