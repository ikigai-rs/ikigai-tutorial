# fmt · clippy · test for the code, and a separate job that builds and TESTS the books.
name: ci

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2

      - name: fmt
        run: cargo fmt --all -- --check

      - name: clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: test
        run: cargo test --all-targets

  # ── The books are a gate, not an artifact ────────────────────────────────────
  #
  # `mdbook test` compiles and runs every Rust block in every book against the real
  # crates, which is the whole reason the tutorial is trustworthy: an example that
  # stops matching the API fails the build instead of misleading a reader.
  #
  # This runs the same script a contributor runs (`./scripts/test-books.sh`), so the
  # local and CI incantations cannot drift — including the isolated target directory
  # the script uses to dodge E0464. See the comment at the top of that script.
  books:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: mdbook

      - name: build and test every book
        run: ./scripts/test-books.sh
