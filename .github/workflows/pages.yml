name: Build, test and deploy the books

# The books' gates and their deploy, in one workflow, so that the tree which reaches
# https://ikigai-rs.github.io/ikigai-tutorial/ (The ikigai Book) and
# https://ikigai-rs.github.io/ikigai-tutorial/gonk/ (The gonk Book) is the tree that just passed
# `mdbook test`, the contrast gate, axe, the no-kernel check, the link check and the transcript
# check — not a second `mdbook build` that could drift from the first. Every gate runs on EVERY
# book under `books/`, so a second book cannot be held to less than the first.
#
# It ALSO runs on pull requests, without deploying: `books` is a gate every PR needs
# whether or not a deploy follows it (it used to live in ci.yml; it moved here so the
# deploy could `needs:` it structurally rather than by convention). Same shape as
# ikigai-web-demo's pages.yml: build + test on every event, publish only from main.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Let Pages read the deployment token. `contents: read` is all the build needs.
permissions:
  contents: read
  pages: write
  id-token: write

env:
  CARGO_TERM_COLOR: always

jobs:
  # ── The books are a gate, not an artifact ────────────────────────────────────
  #
  # `mdbook test` compiles and runs every Rust block in every book against the real
  # crates, which is the whole reason the tutorial is trustworthy: an example that
  # stops matching the API fails the build instead of misleading a reader.
  #
  # This runs the same script a contributor runs (`./scripts/test-books.sh`), so the
  # local and CI incantations cannot drift — including the isolated target directory
  # the script uses to dodge E0464. See the comment at the top of that script. The
  # script builds `books/<name>/book` for every book on the way, and those directories —
  # the same bytes the tests just ran against — are what the deploy below publishes, put
  # where each book's `site-url` says by `scripts/assemble-site.sh`.
  books:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      # Prebuilt mdbook, the same way ci.yml installed it: unpinned on purpose, so a new
      # mdbook release that moves a theme color or renames an element id turns the
      # contrast gate red here instead of going quietly stale behind a pin.
      #
      # wasm-bindgen-cli is the opposite case and is PINNED, to the exact version
      # `crates/book-wasm/Cargo.toml` pins for the `wasm-bindgen` crate. The generated
      # JS and the compiled wasm must agree on their ABI; a mismatch is not a build
      # error anywhere a gate would see it — it is a page whose cells silently fail
      # to load. Bump both or neither.
      - uses: taiki-e/install-action@v2
        with:
          tool: mdbook,wasm-bindgen-cli@0.2.108

      - name: build and test every book
        run: ./scripts/test-books.sh

      # ── Each book's own kernel, in its pages ─────────────────────────────────
      #
      # After the gate, never before it: `test-books.sh` wipes and rebuilds
      # `books/<name>/book`, so anything copied in earlier would be gone. The ikigai book's
      # wasm is a face over `book_wasm::page_kernel()` — Part I's space and the tic-tac-toe
      # game, the crates the book's listings are included from; the gonk book's is
      # `gonk_book_wasm` — the ledger over an in-memory store. Each is bound with
      # `wasm-bindgen --target web` into `wasm/` beside its book, same origin as the pages
      # that load it, under the one name `js/run.js` imports (`scripts/build-kernels.sh`
      # holds the table of which crate is which book's). Generated output; never committed.
      - name: build the in-page kernels (crates/book-wasm, crates/gonk-book-wasm) into the books
        run: ./scripts/build-kernels.sh

      # A silent load failure is the failure: with the module absent every cell's Run
      # is disabled and each board is a sentence, so a deploy with a broken or renamed
      # export would publish a book that cannot run anything. Assert the names the page
      # imports are in the generated JS, by name, before anything is uploaded.
      - name: smoke — the exports run.js, ttt.js, view.js and sheet.js import are present
        run: |
          test -s books/ikigai/book/wasm/book_wasm_bg.wasm
          grep -q '^export function evalLineAsync' books/ikigai/book/wasm/book_wasm.js
          grep -q '^export function evalLineInGameAsync' books/ikigai/book/wasm/book_wasm.js
          grep -q '^export function evalLineInChainAsync' books/ikigai/book/wasm/book_wasm.js
          grep -q '^export function issueAsync' books/ikigai/book/wasm/book_wasm.js
          grep -q '^export function boundNames' books/ikigai/book/wasm/book_wasm.js
          grep -q '^export function useClock' books/ikigai/book/wasm/book_wasm.js
          grep -q '^export function useStoryClock' books/ikigai/book/wasm/book_wasm.js
          grep -q '^export function setStoryClock' books/ikigai/book/wasm/book_wasm.js
          grep -q '^export function issueWithArgsAsync' books/ikigai/book/wasm/book_wasm.js
          grep -q '^export function drawAsync' books/ikigai/book/wasm/book_wasm.js
          grep -q '^export function pushWaitAsync' books/ikigai/book/wasm/book_wasm.js
          grep -q '^export function pushDeadline' books/ikigai/book/wasm/book_wasm.js
          grep -q '^export function pushExpired' books/ikigai/book/wasm/book_wasm.js
          grep -q 'as default' books/ikigai/book/wasm/book_wasm.js

      - name: smoke — the exports run.js imports are present in the gonk book's kernel
        run: |
          test -s books/gonk/book/wasm/book_wasm_bg.wasm
          grep -q '^export function evalLineAsync' books/gonk/book/wasm/book_wasm.js
          grep -q '^export function boundNames' books/gonk/book/wasm/book_wasm.js
          grep -q 'as default' books/gonk/book/wasm/book_wasm.js

      # ── The second accessibility instrument ───────────────────────────────
      #
      # `book-a11y` (inside test-books.sh) measures contrast and checks the STATIC
      # structure of every page. What it cannot see is anything JavaScript adds after
      # load — mdbook's copy buttons, the Run cells `js/run.js` builds, the repairs
      # `js/a11y.js` makes to the search box. axe-core over a jsdom of each built page,
      # with the book's scripts run, sees exactly that. No browser: jsdom has no layout,
      # so axe's color-contrast rule is skipped here — that is book-a11y's job — and the
      # dynamic `import()` of the wasm fails in jsdom, which exercises the cells' no-kernel
      # path (Run disabled, the reason said) rather than the kernel. Both instruments gate
      # the deploy.
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: a11y/package-lock.json
      - name: axe-core over every built book (a11y/axe.mjs)
        working-directory: a11y
        run: |
          npm ci
          status=0
          for book in ../books/*/book; do
            echo "── $book"
            node axe.mjs "$book" || status=1
          done
          exit "$status"

      # ── Without the kernel, nothing is answered ───────────────────────────
      #
      # Every step above builds the wasm, so the path a reader gets when it does NOT load
      # is the one CI would otherwise never see — and it once pre-filled every cell with
      # the listing's output (2026-09-27). `a11y/no-kernel.mjs` loads every page with a
      # cell or a board, refusing `wasm/`, and requires empty results, disabled and
      # described Run buttons, and boards with no squares. The boards are still drafts, so
      # the drafts are built too — with --no-kernel, into `target/` (ignored, and a path
      # that means the same thing locally, where `just gates` runs this step), never into
      # the uploaded `books/ikigai/book`: drafts must not deploy. Every built book is
      # checked; only the ikigai book has drafts.
      - name: no kernel, no answers (a11y/no-kernel.mjs)
        run: |
          ./scripts/serve-with-drafts.sh build target/drafts-no-kernel --no-kernel
          cd a11y
          node no-kernel.mjs ../books/*/book ../target/drafts-no-kernel

      # ── One site, two books ──────────────────────────────────────────────────
      #
      # Each built book goes where its `book.toml`'s `site-url` says (the ikigai book at the
      # root, the gonk book at `gonk/`), into ONE directory, which is what is uploaded. Then
      # every relative link in that directory must land on a file in it: mdbook checks a
      # link between two chapters of one book, and nothing checks a link between the books
      # (`gonk/` from the ikigai book's "Where to go next", `../index.html` back) except this.
      - name: assemble the site, and check every relative link in it (a11y/links.mjs)
        run: |
          ./scripts/assemble-site.sh target/site
          cd a11y
          node links.mjs ../target/site

      - uses: actions/upload-pages-artifact@v3
        with:
          path: target/site

  # ── Every shell transcript, against the gonk the book pins ─────────────────
  #
  # A `console` block in the gonk book is the page saying "type this, see that", and
  # `scripts/test-transcripts.sh` types it: it installs gonk at the revision in
  # `books/gonk/gonk.rev` (`cargo install --locked --git … --rev`) and `ikigai-cli` at the version
  # in `books/gonk/ikigai-cli.version`, runs each page's commands
  # in a scratch home, and compares what they print with what the page says (ledger #165).
  # A job of its own because building gonk compiles RocksDB; the build is cached by that
  # revision, so it is paid once per pin. The deploy needs it like it needs `books`.
  transcripts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      # Only the installed binary is cached, not the build tree (RocksDB's objects are most of
      # a gigabyte and are never needed again for the same revision).
      - name: the pinned gonk, cached by its revision
        uses: actions/cache@v4
        with:
          path: target/gonk/*/bin
          key: gonk-${{ runner.os }}-${{ hashFiles('books/gonk/gonk.rev') }}
      - name: the pinned ikigai-cli, cached by its version
        uses: actions/cache@v4
        with:
          path: target/ikigai-cli/*/bin
          # `-quic`: the cli is built with its `quic` feature (see the script); a cache of a build
          # without it must not be restored under the same key.
          key: ikigai-cli-${{ runner.os }}-${{ hashFiles('books/gonk/ikigai-cli.version') }}-quic
      - name: replay every transcript (scripts/test-transcripts.sh)
        run: ./scripts/test-transcripts.sh

  deploy:
    # A pull request builds and tests; only main (and a manual dispatch) publishes.
    needs: [books, transcripts]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    # One deploy at a time, and a deploy in flight is never canceled: Pages would be
    # left with whichever half-finished state the cancellation interrupted. A fixed group
    # rather than one keyed by ref because only main ever reaches this job. (The PR-side
    # `books` runs above are not in the group, so concurrent PRs do not queue on each
    # other.)
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
