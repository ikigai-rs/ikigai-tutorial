# The ikigai tutorial workspace.
#
# Books are mdbook projects under `books/`. The code each book teaches is a real crate
# under `crates/`, and the book pulls its snippets in by ANCHOR rather than copying
# them — so there is one `camel-case`, and it is the one that compiles.
#
# `mdbook test` then runs every runnable block in the book as a doctest, which is the
# property worth protecting: a tutorial's examples rot silently, and the first reader
# to hit a stale one assumes they are the problem.
[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
edition = "2021"
license = "MIT"
authors = ["Brian Sletten <brian.sletten@gmail.com>"]
repository = "https://github.com/ikigai-rs/ikigai-tutorial"

# Only the in-page kernel (`crates/book-wasm`) is built in release, and it is shipped to
# a browser: size is the cost that matters there. Same profile ikigai-web-demo uses.
[profile.release]
opt-level = "z"
lto = true

[workspace.dependencies]
# Published crates, deliberately — NOT path refs to sibling checkouts. A reader who
# clones only this repo must be able to `cargo run` immediately; path refs would
# require them to have the whole ecosystem laid out beside it.
# 0.1.78 is the floor because the book teaches API that arrived in the six releases
# 0.1.73–0.1.78, and states each: a cacheable read hangs from its own name (0.1.73),
# `Scope::with_named_at` + `Kernel::is_cached_in` for as-of resolution (0.1.75),
# `Limit` (0.1.76), `.lossy()` and the `lossy=allow` consent (0.1.77), and
# `urn:kernel:topology` (0.1.78). (Before that the floor was 0.1.72, where the
# resolution chain — `Scope::with_named` and `Kernel::issue_in` — arrived; before that
# 0.1.66, which `ikigai-vocab` 0.1.66 requires.)
ikigai-core = "0.1.78"
# `TurtleRenderer`: the projection of a `Description` to Turtle, injected into the
# kernel so `urn:kernel:catalog` and `Meta` answer in the book's own host.
ikigai-vocab = "0.1.66"
ikigai-fn = "0.2.0"
# 0.3.1 is what the book's status chapter stamps its claims at (`book_claims` re-checks them
# against that published crate), so it is the pin; 0.3.1 over 0.3.0 is a constructor form,
# no new surface. 0.3.0 is the version where the module wire carries the error TYPE both ways, a result's
# declared golden threads, and the module's cards (so the manifold through a ModuleSpace
# lists the module's own actions and the host enforces its `requires` from its own
# description). It was a minor bump because `ModuleCall`/`ModuleReply` are exhaustive
# public enums and gained variants; `ModuleSpace::new(prefixes, transport, floor)` did not
# change. ⚠ Under Cargo's 0.x rules the previous pin, "0.2.0", was a CEILING (<0.3.0) as
# well as a floor: the book sat one minor behind for two weeks while describing itself as
# current (ledger item 164). Read a caret on a 0.x crate as a RANGE.
# (Older history: 0.2.0 enforced a module endpoint's declared `requires` across the
# boundary, growing `ModuleSpace::new` its `ModuleFloor` argument; 0.1.9 was the floor
# because `Resolved` grew a public `canonical` field in ikigai-core 0.1.64.)
ikigai-module = "0.3.1"
# The published SPARQL face, for "The graph face": `urn:sparql:select` over the catalog.
# Brings oxigraph, which is the price of a real query engine and is paid by one crate.
ikigai-sparql = "0.1.7"
# A Turtle parser and the RDF model it produces, for the transreptor the reader writes
# in "Transreption" — the same parser `ikigai-vocab` tests its own output with.
oxttl = "0.2"
oxrdf = "0.3"
# The config file "Configuration" reads through `layered_paths`.
toml = "0.8"
futures = "0.3"
