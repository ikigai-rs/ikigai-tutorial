# comes near the cap. Before that the pin was 0.2.22, the published head that morning and what ledger
# 0.12.0 requires (0.2.21, a security floor). 0.2.20 names a consumer's own timeout argument (ledger #1383); 0.2.21
# counts a GRAPH block's patterns toward the join bound, caps in-flight overdue work and bounds a
# load (ledger #1426–#1428); 0.2.22 REFUSES a scoped read whose constant `GRAPH <iri>` names a graph
# outside its `graph=` set, naming the graph, where it answered empty (ledger #388), and adds the
# join count and `SharedWriter::narrowed_away` (ledger #1464, #1479). It stays a caret, not an exact
# pin: nothing here depends on one patch's bytes, and a caret lets a reader's resolve take the next
# security floor. No page's query names a GRAPH outside its set. Before that the pin was 0.2.19, the
# published head with ledger 0.11.0, and what the pinned gonk (71ca542) linked: 0.2.16 and 0.2.17
# make every `SharedWriter::over` on one
# handle share the store's one writer (ledger #1276, #1324), 0.2.18 adds `EvaluationBudget`, a time
# budget for SPARQL a consumer evaluates itself (ledger #1327), and 0.2.19 bounds the RDF 1.2 triple
# terms an update leaves in the store and reads `<<(` as one token (ledger #1333, #1354). No crate
# here calls `over` or the budget, no page writes a triple term, and every answer a page prints is
# the same. Before that, 0.2.12 was the pin because it was the published head, and markdown 0.1.3
# requires 0.2.11: 0.2.11 words a SPARQL `SERVICE` refusal for the consumer that asked (ledger
# #1094), and 0.2.12 runs every update on the store's one writer thread, so reads after a bulk
# write stay fast (ledger #1127). No page uses `SERVICE`, and no query a page runs changed its
# answer. 0.2.14 was then the pin because it was what the pinned gonk (9f2e89e) linked: 0.2.13 copies
# a scoped update's footprint rather than the whole graph (ledger #1132), and 0.2.14 hands a host
# that writes through the raw handle the store's own writer thread (`SharedWriter`, ledger #1207),
# which no crate here uses; every answer a page prints is the same. 0.2.15 is the pin because it
# is what the pinned gonk then (2598192) linked: it enforces the graphs an update declares and loads on
# the writer thread (ledger #1207, #1209). Before that the pin was 0.2.14. Before 0.2.14
# the pin was 0.2.12 for the reasons above. Before that the pin was 0.2.10, the head on the morning of 2026-10-10, which ledger
# 0.6.2 requires: 0.2.9 bounds the SIZE of every SPARQL answer, refusing rather
# than truncating (ledger #970), and 0.2.10 sizes the SPARQL thread for the build (ledger #1003).
# No query a page runs comes near either bound. Before that the pin was 0.2.8, what gonk edb9a3d
# links (gonk PR 104), and 0.2.7 is a security floor below which no book crate should sit (ledger
# #915; cli 0.1.43 adopted it). A 0.x caret: also a ceiling (<0.3.0).
ikigai-store = { version = "0.2.23", default-features = false }
# The repository browser and its model-derived layers (explain, review, findings), for The gonk
# Book's "Explain, with a mounted model" and "One-off review". 0.19.0 is the pin (set 2026-10-20;
# later 0.19.x releases are inside the caret): the review pass and the judge loop stop at the first `Refused` or `RetryAfter`
# from the mounted model, as they already stopped at a `Denied`, and return that error with its
# type kept, so an edge can answer 429 with `Retry-After` instead of spending the remaining regions
# (ledger #1932). An `Endpoint` failure stays the region's own. It is what gonk's review door
# adopts in the same wave, so the book tracks it; the book's stub model never refuses or
# rate-limits, so no page's output moves. It also carries the never-published 0.18.11 (a
# dev-dependency bump). Its floors lift the lock's ikigai-core to 0.1.108, and it takes ikigai-a11y
# 0.3 (with `themes`), so the lock no longer holds a11y 0.2. A 0.x caret: also a ceiling (<0.20.0);
# read it as a RANGE.
# Before that the pin was 0.18.9, the published head: one writer per store handle, narrowed to the
# mount graph (ledger #1324), and a PR explanation cut at the output budget is refused rather than
# archived (ledger #1055); no Rust API, resource name or stored term moved. The pinned gonk
# (3edf830) links 0.18.8. Before that the pin was
# 0.18.8, the published head and what the pinned gonk (71ca542) linked: 0.18.7 archives a review
# pass that
# carries findings when every fresh quote misquotes (ledger #1303), and 0.18.8 keeps an erroring
# pass's clean memos and names memo-less regions in the region count (ledger #1312); the stub
# model's explanations and findings printed the same at it. Before that the pin was 0.18.6, what
# gonk 2598192 linked: 0.18.5 writes every archive record in one transaction on
# ikigai-store's `SharedWriter` (ledger #1207, #1253), and 0.18.6 adds
# `Mount::annotations_through`, writing annotations through a host's writer (ledger #1252), which
# no crate here calls. Before that the pin was 0.18.4, what gonk 9f2e89e linked: 0.18.3 lists a symlink in the tree only when the jail serves its
# target (ledger #1130), and 0.18.4 commits every browse write on one writer thread, so reads after
# a burst of writes stay fast (ledger #1131). No chapter's root holds a symlink, and the stub
# model's explanations and findings printed the same at it. 0.18.2 is a SECURITY floor: it never
# serves a repository's `.git` (refused at the jail, hidden from the listing; ledger #1126). No chapter lists or reads
# `.git`, so nothing a page prints moved. Before that the pin was 0.18.1: a review answer's last finding is kept when it cannot have been cut (ledger
# #818), and the chapter's stub answer printed the same findings at it. The 0.18 floor was 0.18.0, the
# release that added the explain-status cost line the chapter shows ("opens instantly from the
# archive"), and what gonk edb9a3d linked.
ikigai-browse = "0.19.0"
# The RDF store browse keeps its archive, findings and annotations in. browse takes an
# `oxigraph::store::Store` directly (not `ikigai-store`), so a host names the crate itself. In
# memory: default features off, as every other oxigraph line in this workspace's graph.
oxigraph = { version = "0.5.11", default-features = false }
# Markdown as a graph, for the OpenSpec part: one generic structural lift plus a MAPPING resource
# (a lift profile and SPARQL CONSTRUCTs), found by name at `urn:markdown:mapping:{name}` under a
# config home. 0.1.4 is the pin (set 2026-10-14; 0.1.5 is inside the caret): it runs a lift's CONSTRUCTs
# under ikigai-store's `EvaluationBudget` (5 s, raised by a `urn:cap:store:budget:<ms>` grant, 120 s
# for root; a `Timeout` past it), adds `space_with_budget`, and requires store 0.2.19, the pin
# below (ledger #1344). The book's caller is root and the OpenSpec constructs finish far inside
# the base, so the lift prints the same graph. One lift space is mounted, so `space_with`'s
# default budget is already the one per host its README asks for. Before that the pin was 0.1.3:
# it words the `SERVICE` refusal as a mapping's remedy rather than the store's (ledger #1108).
# Before that the pin was 0.1.2:
# 0.1.1 bounds a mapping's SPARQL
# and reads frontmatter without recursion (ledger #963), and 0.1.2 refuses SPARQL `SERVICE` in a
# mapping in every build (ledger #1085). The OpenSpec mapping uses neither `SERVICE` nor deep
# frontmatter, so it lifts the same graph. 0.1.0 is the first release on crates.io (2026-10-06);
# before it, this line was a pin to one full git revision of the public repository, the way
# DESIGN.md pins gonk. A 0.x caret, so also a ceiling (<0.2.0).
ikigai-markdown = "0.1.4"
# Scripts as resources, for the section "Code and language as resources": `urn:script:{name}`
# with content-addressed versions, `…:result` (run as a read) and `…:runs` (run for effects),
# under the least of what a script declares, what its publisher held and the host's ceiling.
# 0.3.6 is the pin (set 2026-10-14): its one library change is the ikigai-core floor,
# raised to 0.1.100 (a tested floor, set by its ikigai-conformance 0.8 dev-dependency), beneath the
# core pin above; no API change. Before that the pin was 0.3.5, the head that morning: 0.3.4 lets a script declare a store time
# budget, bounded like the rest of its authority (ledger #1384), and 0.3.5 moves its ledger and store
# dev floors to the security releases (ledger #1458); no chapter declares a budget. 0.3.3 is the
# floor for what the chapters PRINT: a run of a draft is refused for its
# state ("… is a draft; publish it to run it"), where before it the generic run contract declared
# `urn:cap:lisp` and the author of a SPARQL draft was told her capability did not grant Lisp
# (ledger #1261), and a query that reads no graph is refused saying what to write (ledger
# #1278). The API floor is 0.3.0: "Who a script runs as" teaches NAMESPACE grants
# (`urn:cap:script:write:team-*`) and exclusions, and `authority::holds`, which arrived there
# (ledger #1173, #1174); 0.3.1 and 0.3.2 fix plans (ledger #1220, #1222), which no chapter
# publishes. It requires core 0.1.95, the line above. A 0.x caret: also a ceiling (<0.4.0);
# read it as a RANGE.
ikigai-script = "0.3.6"
# Natural language to a DRAFT script, for "A sentence becomes a draft": `urn:nl:grounding` (what
# the caller may see, as data), `urn:nl:sparql:check` and the drafter `urn:nl:sparql`. 0.4.0 is the
# pin and the floor: the release whose drafter, when the model gives
# a draft it already gave, marks that attempt a repeat (`repeatOf` in JSON, `prov:alternateOf` in
# Turtle) and says "drafting stopped: the model repeated attempt N" rather than naming a bound it
# did not reach (ledger #1298), which the chapter's stub shows. 0.3.0 made an empty preview a
# warning with its evidence (the patterns that match nothing alone), repaired and marked it, stated
# each predicate's value kinds in the grounding, and gave the drafter `focus=` (`graph=` a
# deprecated alias; ledger #1242, #1243). 0.2.1 asked the script host's own rule whether the caller
# may read a named example (ledger #1196); 0.2.0 bounded each draft with `max_tokens` (ledger
# #1203), which the stub model records. It requires ikigai-script 0.3.0 itself. A 0.x caret: also a
# ceiling (<0.5.0); the old pin "0.3.0" was a ceiling below 0.4 and held the book at 0.3.
ikigai-nl = "0.4.0"
# A real model, for the reader who has one: "A sentence becomes a draft" runs against a stub in
# every gate (no network, ever), and `cargo run -p sentence-draft -- --ollama MODEL` swaps in
# `ikigai-llm`'s `urn:llm:ask` over a local Ollama. llm 0.16.0 and the HTTP seam it is built on,
# ikigai-http 0.3.0 (`HttpTransport`, which the host fills), set 2026-10-21; they move together,
# since llm 0.16 takes http ^0.3. http 0.3.0 maps an origin's status to core 0.1.108's failure
# classes in one public table (`ikigai_http::status`): a 401/403 is `Refused` (was `Denied`), a 429
# or a 503 with `Retry-After` is `RetryAfter`, a 500 is `Endpoint`, and a transport failure that
# timed out is `Timeout`; llm 0.16.0 types every failure through that table. `HttpTransport` did
# not change, so `Ureq` compiles as it was, and the drafter reports whatever the failure says.
# Before that: llm 0.15.0 and http 0.2.1. http 0.2.0
# renamed `urn:httpGet` to `urn:http:get` (ledger #11) and made `HttpTransport` a second, distinct
# trait from 0.1's, so llm and http move together: llm 0.15.0 takes ^0.2, and `Ureq` must implement
# that trait. 0.14.0 typed a transport failure as `Unavailable` or `Timeout` where 0.13 said
# `Endpoint`, and refuses an `as=` its faces do not declare (ledger #88, #179); the drafter reports
# whatever the model's failure says, and asks for no face. 0.x carets: ceilings too (<0.17.0,
# <0.4.0); the old pins "0.15.0" and "0.2.1" were ceilings below 0.16 and 0.3.
ikigai-llm = "0.16.0"
ikigai-http = "0.3.0"
# The blocking HTTP client that fills `HttpTransport` for that one path, as ikigai-llm's own
# `ask` example does. No default features: no TLS, since a local Ollama speaks plain HTTP on
# localhost. "2" is that example's line; a caret, so <3.0.0.
ureq = { version = "2", default-features = false }
# "Checking a resource" (ledger #2024): the RDF Toolbox's names, `urn:toolbox:check:{iri}` and
# `urn:toolbox:input:{iri}`, the Turtle face it reads under the caller's capability. 0.1.0 is the
# first release, and the floor; it needs core ^0.1.89 and fn ^0.5, both below the pins here. The
# crate holds no build: the page and its WebAssembly engine are a directory a host binds (its
# `build.sh`), and nothing here builds or binds one. A 0.x caret: also a ceiling (<0.2.0).
ikigai-toolbox = "0.1.0"
# The same chapter's shapes check on the host, `urn:shacl:validate`. Default features OFF: from
# 0.4.0 that is the CORE-only subset validator (`core_shacl`) on oxrdf and oxttl alone, which covers
# closed shapes (`sh:closed`, `sh:ignoredProperties`) and every constraint the chapter's shapes use,
# with no rudof, no network stack and no SPARQL (no oxigraph, spargebra or ikigai-store; ledger
# #2107). `sh:sparql` and `sh:select` are refused by name, and the chapter's shapes use neither.
# Nothing here may turn on shacl's `sparql` or `rudof` feature: unified into the page kernel, it
# would bring the store back (`cargo tree -e features -i ikigai-shacl` shows none). Through 0.3.x
# the same line linked the SPARQL engine: the ikigai Book's `book_wasm_bg.wasm` measured 8.74 MB
# raw, 1.77 MB gzip -9 at 0.3.7 and 4.89 MB, 1.09 MB at 0.4.0 (2026-10-22, ledger #2115). A 0.x
# caret: also a ceiling (<0.5.0).
ikigai-shacl = { version = "0.4.0", default-features = false }
# The JSON faces the drafting chapter reads back (a draft's attempts, a check's findings).
serde_json = "1"
# The config file "Configuration" reads through `layered_paths`.
toml = "0.8"
futures = "0.3"
