# from, and they follow gonk's lock until a release the book needs runs ahead of it. Today they run
# ahead: the gonk in `gonk.rev` (3edf830) links core 0.1.99, ledger 0.11.1, store 0.2.21, browse
# 0.18.8, script 0.3.3 and nl 0.4.0, while these crates lock core 0.1.109, ledger 0.12.0, store
# 0.2.23, browse 0.19.0 and script 0.3.6. A console transcript is gonk's answer
# and a cell or `cargo run` is these crates', each checked against its own source, so the gap is
# recorded in books/gonk/DESIGN.md. (From 2026-10-12 to 2026-10-14 the gonk then pinned (71ca542)
# linked core 0.1.99, ledger 0.11.0, store 0.2.19, browse 0.18.8, script 0.3.3 and nl 0.4.0, as these
# crates did (ledger #1365). From tutorial
# PR 111 and PR 112 to ledger #1365 the pinned gonk, 2598192, linked core 0.1.96, ledger 0.9.0 and
# store 0.2.15 while these crates took core 0.1.98, ledger 0.11.0 and store 0.2.19, so its consoles
# printed the family-scope refusal without core 0.1.97's clause; until 9f2e89e the pinned gonk,
# 9704b54, linked ledger 0.6.2 while these crates took 0.9.0, so no transcript could ask `count`;
# ledger #1245 closed that gap.)
# 0.12.0 is the pin (set 2026-10-14): 0.11.1 fixes an unled audit's findings (a
# deep `blocks` chain, a large ledger, closed items; ledger #1418–#1423) and floors ikigai-store at
# 0.2.21, a security floor; 0.12.0 accepts `labels=` at any length, adds `parent=` on items and
# `count`, `Filter::parent` and `Item::children`, puts `"children": []` in every JSON item object, and
# gives `next` the hand-back reason (ledger #1452, #1454, #1455). Additive: no crate here builds an
# `Item` or a `Filter`. The old pin "0.11.0" was a ceiling below 0.12. Before that the pin was
# 0.11.0, the published head then: 0.10.0 adds `urn:cap:ledger:about:{ledger}`,
# which adds and removes an item's `about` edges without the close grant (`write:{ledger}` still
# covers it, so `ledger-host`'s writer is unchanged), and `item:{id}:about` now declares the family
# `urn:cap:ledger:*`, as claim, comment and close do (ledger #1315); 0.11.0 adds a claim kind,
# `agent` (`ClaimKind::Agent`, and `ClaimKind` is `#[non_exhaustive]` from now on; ledger #1329),
# which no crate here matches on or stamps. Every cell and Rust chapter prints what it did on 0.9.0.
# The API floor is 0.9.0, because part 5 ("The ledger as the work queue") asks the ledger how many
# items implement a requirement with `urn:iki:ledger:count`, which 0.9.0 added (the total alone,
# one COUNT query, without `items`' page or its corpus check; ledger #1128). Below that, 0.4.0 is
# the floor `sync_ledger` needs: the keyed append (`append key=<task IRI>`: at most one item per
# key, enforced by the ledger in the same store update that files it, answering `existing` when
# the key is taken), which is what makes two concurrent syncs safe. It also made `Item` and
# `Filter` `#[non_exhaustive]`; no crate here builds either.
# What 0.7.0 and 0.8.0 brought (neither was published on its own; 0.9.0 carries both): per-verb
