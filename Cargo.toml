# The ikigai tutorial workspace.
#
# Each book is a member crate under `books/`, and a book IS its rustdoc: the prose
# lives in `//!` module docs, the examples are doctests, and `cargo doc` renders the
# result. That is a deliberate choice rather than a convenience — a tutorial whose
# examples are doctests cannot silently rot, because `cargo test` compiles and runs
# every one of them. The field guide's rule ("a doctest is the only comment the
# compiler reads") applied to teaching material.
[workspace]
resolver = "2"
members = ["books/*"]

[workspace.package]
edition = "2021"
license = "MIT"
authors = ["Brian Sletten <brian.sletten@gmail.com>"]
repository = "https://github.com/ikigai-rs/ikigai-tutorial"

[workspace.dependencies]
# Published crates, deliberately — NOT path refs to sibling checkouts. A reader who
# clones only this repo must be able to `cargo run` immediately; path refs would
# require them to have the whole ecosystem laid out beside it.
ikigai-core = "0.1.62"
ikigai-fn = "0.1.2"
futures = "0.3"
