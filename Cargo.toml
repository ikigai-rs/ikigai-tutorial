# The ikigai tutorial workspace.
#
# Books are mdbook projects under `books/`. The code each book teaches is a real crate
# under `crates/`, and the book pulls its snippets in by ANCHOR rather than copying
# them — so there is one `camel-case`, and it is the one that compiles.
#
# `mdbook test` then runs every runnable block in the book as a doctest, which is the
# property worth protecting: a tutorial's examples rot silently, and the first reader
# to hit a stale one assumes they are the problem.
[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
edition = "2021"
license = "MIT"
authors = ["Brian Sletten <brian.sletten@gmail.com>"]
repository = "https://github.com/ikigai-rs/ikigai-tutorial"
homepage = "https://ikigai-rs.github.io/ikigai-tutorial/"

# Only the in-page kernel (`crates/book-wasm`) is built in release, and it is shipped to
# a browser: size is the cost that matters there. Same profile ikigai-web-demo uses.
[profile.release]
opt-level = "z"
lto = true

[workspace.dependencies]
# Published crates, deliberately — NOT path refs to sibling checkouts. A reader who
# clones only this repo must be able to `cargo run` immediately; path refs would
# require them to have the whole ecosystem laid out beside it.
# Each pin states the minimum the book needs, and a 0.x caret is a RANGE: "0.1.109" admits
# every 0.1.x from 0.1.109 up and nothing from 0.2. A pin moves when the book teaches what a newer
# release changed, when a release changes what a page prints, or to keep the book on what a
# reader's fresh `cargo add` resolves; its comment says which, and keeps the reason that set the
# previous floor beneath it. Releases that came out after a pin was set are not listed as missing.
# 0.1.110 is the pin, set 2026-10-22 (ledger #2007): "A space that changes while it runs" declares a
# view, an alias rule that resolves at the root (`ik:resolveAt "root"`, `AliasTable::exact_at_root`),
# which 0.1.110 added; it changed nothing any other page prints (every listing and cell ran
# unchanged at the move). The same chapter builds the first `DynamicSpace` a listing uses (0.1.109).
# Before that the pin was 0.1.109, set 2026-10-21 (ledger #2006 is its own release): 0.1.105 is the floor for
# what the books TEACH, because it changed behavior an endpoint relies on: the kernel fills a
# declared `default_value` in before dispatch, and `Description::validate` refuses a defaulted
# input marked required. Exercise 2 runs that in a checked block, where its hint used to say the default
# was not injected (ledger #19). 0.1.108 gives every error a class (`Error::class()`,
# `RetryAfter`/`OverBudget`/`Refused`), `Verb::is_idempotent`, declared failure classes
# (`fails(..)`, `ik:mayFail`), a run's shared retry budget and its deadline (`IssueContext`,
# `not_after`, `Invocation::time_left`); ikigai-throttle 0.2.0 requires it, and "Preference"
# teaches its `Failover`. 0.1.109 adds dynamic spaces (`DynamicSpace`, `Threaded`), which the
# status chapter names and, since 0.1.110's pin, "A space that changes while it runs" and
# Spreadsheet VII run. The status chapter's opening names this version, and
# `book_claims` holds it to the lock. Before that the pin was 0.1.103 (the lock had reached 0.1.108
# as ikigai-browse 0.19.0's floor): a typed
# selection offers the input-free actions only beside a real typed fit, so a typed query that fits
# nothing answers nothing, where 0.1.102 answered every argument-free action (ledger #271). No page
# asks a typed selection; the untyped `urn:kernel:actions` listing is unchanged. The `ikigai` the
# ikigai Book replays (cli 0.1.63) links 0.1.103 as well, so its REPL transcripts and its cells now
# answer from one core. Before that the pin was 0.1.102, core's published head that morning.
# 0.1.100 and 0.1.101 encode a
# `[`, `]`, `#` or `?` in a name wherever an IRI is minted from it (ledger #1361, #1390), which no
# crate here names. 0.1.102 is additive in the API (`Capability::satisfies`, `Verb: Ord`) and changes
# three things a consumer observes: a typed selection ends with every argument-free action, the
# kernel's own among them (ledger #271); every `urn:kernel:*` operation is a trace node (ledger
# #39); and `urn:kernel:validate endpoint=` resolves in the caller's chain (ledger #28). The pinned
# gonk (3edf830) links 0.1.99, and so does the `ikigai` both books replay (cli 0.1.61 and 0.1.62,
# installed `--locked`, link 0.1.99), so a console or REPL transcript can print what 0.1.99 printed
# while a cell or `cargo run` prints 0.1.102; no page printed differently at the move
# (books/gonk/DESIGN.md records the gap). Before that the pin was 0.1.99, core's published
# head and what the pinned gonk (71ca542) then linked: `Description::validate` refuses an endpoint
# id or input name holding a code point no IRI can carry
# (DEL, a C1 control, private use, a noncharacter; ledger #1351), which no crate here names. The
# floor for what the books PRINT is 0.1.97 (YANKED: it was published from a draft branch, and a lock
# must never hold it), whose change the books show: a refusal at a FAMILY scope (`prefix*`) names
# what satisfies it, `capability does not grant `urn:cap:script:run:open-*` (declared by `…`; any
# grant under `urn:cap:script:run:open-` satisfies it)`, which "Who a script runs as" shows (ledger
# #1292, #1323); an exact scope's refusal is unchanged byte for byte. The `ikigai` both books replay
# (cli 0.1.56) and the pinned gonk link 0.1.98 or later too, so a crate's run, an in-page cell, a
# REPL transcript and a gonk console all print that clause (ledger #1365). Before that the pin was
# 0.1.98: a `%` in an endpoint id or input name is a character (`%25`) wherever an IRI is minted
# from the name, and an authored scope that is not an IRI is a literal in every face, neither of
# which a page uses. Before that the pin was 0.1.96: what the pinned gonk then linked, and the cli
# crates at 0.1.52 (engine, resolve, ipc, quic, web) require it: it adds the layer vocabulary
# (ledger #1182), which no page uses, and nothing a page prints moved. Before that the pin was
# 0.1.95, core's published head and what the cli 0.1.46 crates required: 0.1.94 refuses a sign in a
# percent escape of a match or contract IRI (`%+1`), and 0.1.95 parses those IRIs leniently and
# emits only their canonical spelling (`canonical_match_iri`, `canonical_contract_iri`), and a Sink
# or Delete the kernel dispatched cuts its target whether it succeeded or failed (a refusal before
# dispatch cuts nothing). No page printed differently at it: every cell, every `cargo run` output
# and every transcript replayed unchanged. Before that the pin was 0.1.93, core's head on the
# morning of 2026-10-10 (0.1.92: a failed invocation is a trace node; 0.1.93: a principal is a
# capability scope, and `Invocation::depends_on` names the thread a failure hangs from), with
# nothing printed differently either. Before that, 0.1.91 was the floor because the book prints what
# it changed (ledger #948, #1034): an action's
# match has its own IRI, `urn:ikigai:match:{verb}:{pattern}`, one per door and verb, and the
# contract behind it is CONTENT-ADDRESSED, `urn:ikigai:contract:{id}:{verb}:b3:{hex}`, joined to
# the match by `ik:contract`. The old per-id `urn:ikigai:endpoint:{id}:action:{verb}` is gone, so
# every `Meta` and catalog graph a chapter shows moved with it, and a book below 0.1.91 would
# print IRIs its own pages no longer quote. 0.1.90 changed nothing here (vocab's space names
# itself). A 0.x caret: also a ceiling (<0.2.0). Before that the floor was 0.1.87, because three
# chapters run what it added: `urn:kernel:explain`, the dry run
# of a resolution ("Tracing a resolution"), `urn:kernel:dependents`, what cutting a golden thread
# would recompute ("Golden threads"), and `Description::unsatisfied_scopes`, the floor's own
# predicate, which "Identity" uses to check that a published grant list covers every verb (ledger
# #932–#934); 0.1.89's one behavioral change (binding a door drops a space's name) touched
# nothing here: no book crate names a space. Before that the floor was 0.1.84, because part VII's test compares the coded game with the declared one
# through `Kernel::root_topology()`, the root space's own arrangement, instead of unwrapping the
# chain a request carries by hand; and because ikigai-sexpr 0.1.5 requires it (declarations are
# bounded in core's units). Before that the floor was 0.1.83, because tic-tac-toe's part VII
# teaches what it added: a space BUILT from its declaration (`Topology::from_turtle` behind the
# `declare` feature, `Registry`, `build`), the inverse of `urn:kernel:topology`, with every door
# naming the endpoint that answers it. Before that the floor was 0.1.82, because the spreadsheet arc teaches what it added: the
# cache readout marks a row `live`, `cut` or `expired`, and `urn:kernel:cached target=` answers for the
# asker (ledger #612), which is what lets the page's cache viewer be a composition; and a
# fallback over a composite's NotFound is cut when the atom changes (ledger #611), which
# turns part V's trap into history. (Before that the floor was 0.1.78, for the six releases
# 0.1.73–0.1.78: a cacheable read hangs from its own name (0.1.73), `Scope::with_named_at` +
# `Kernel::is_cached_in` for as-of resolution (0.1.75), `Limit` (0.1.76), `.lossy()` and the
# `lossy=allow` consent (0.1.77), and `urn:kernel:topology` (0.1.78); before that 0.1.72,
# where the resolution chain arrived; before that 0.1.66, which `ikigai-vocab` 0.1.66
# requires.)
ikigai-core = "0.1.110"
# `TurtleRenderer`: the projection of a `Description` to Turtle, injected into the
# kernel so `urn:kernel:catalog` and `Meta` answer in the book's own host. 0.1.109 is the pin, paired
# with core 0.1.109 (set 2026-10-21): since 0.1.105 it renders the ArgSpec shape (input groups,
# list arguments, value notes), and since 0.1.108 an action's stated failure classes as
# `ik:mayFail`; 0.1.109 defines `ik:DynamicSpace`. No page prints a contract that states either,
# and every printed Meta and catalog graph replayed unchanged at the move. Before that the pin was
# 0.1.103, paired with core 0.1.103: it moves `owl:versionInfo` and nothing else, which no
# page renders. Before that the pin
# was 0.1.102, paired with core 0.1.102: 0.1.101 spells a plan id as a name (ledger #1391), and
# 0.1.102 moves `owl:versionInfo` and nothing else; no page renders either. Before that the pin was
# 0.1.99, paired with core 0.1.99: it moves `owl:versionInfo` and nothing else, which no
# page renders. Before that the pin was 0.1.98, paired with core 0.1.98 (0.1.97 is yanked with
# core's): it spells a `%` in an endpoint id or input name as `%25`. Before that the pin was 0.1.96,
# paired with core 0.1.96 (it defines the layer family, which no page renders). Before that the pin
# was 0.1.95, paired with core 0.1.95; 0.1.94 and 0.1.95 change only its `owl:versionInfo` and its
# tests (the shared contract vectors), and it still requires core 0.1.91 or later. Before that the
# pin was 0.1.93, paired with core 0.1.93. Before that, 0.1.91 was the floor because it renders each
# action at its content-addressed contract IRI (above), with the action's inputs under that
# contract, and its vocabulary defines `ik:contract` and documents `ik:ActionMatch`'s new subject;
# it requires core 0.1.91. Before that the pin was 0.1.66, the release core 0.1.66 paired with,
# while the lock resolved 0.1.78. A 0.x caret: also a ceiling (<0.2.0).
ikigai-vocab = "0.1.109"
# 0.3.0: compose became a view template language. `$h{…}` splices a value HTML-escaped and
# never expands it, which retires the sheet's `html:{ref}` stopgap; `compose_over(src)` binds a
# template at a view's name, which retires the grid's request of glue. ⚠ A 0.x caret is a
# ceiling too: "0.3.1" admitted nothing from 0.4, and the book sat behind that ceiling until
# 2026-10-10. 0.3.1 became the floor because part VII uses what it added: `ComposeOver::named`,
# so each of the game's views carries a name of its own, which is what a declared door binds it
# by (an unnamed one is `composeOver`, like every other). 0.5.0 is the pin, set 2026-10-21: `$h{…}`
# replaces a C0 control other than tab, LF and CR with U+FFFD, through the new shared
# `ikigai_fn::html` escaper (ledger #1813); no view the book composes splices one, so no page's
# output moved.
# The old pin "0.4.1" was a ceiling below 0.5. Before that the pin was 0.4.1: 0.4.0's one change is that `space()` names itself `urn:iki:space:fn` (ledger
# #987), and the book binds compose behind doors of its own, and binding a door drops a space's
# name (core 0.1.89), so no answered-by or topology a page prints moved; 0.4.1 exports
# `MARKER_LETTERS` and `escape_markers`, which nothing here uses. A 0.x caret: also a ceiling
# (<0.6.0).
ikigai-fn = "0.5.0"
# An arrangement written as an s-expression (`*.arrangement`, `text/x-ikigai-arrangement`),
# transrepted losslessly to and from the `ik:` Turtle core builds a space from. 0.1.5 is the floor
# because it added `arrangement_space()`, which mounts the arrangement surface alone, and the `full`
# feature, off here: nothing in the tutorial mounts the query or graph compilers or the code-graph
# codec, so the page compiles neither `sha2` nor `oxrdfio` (ledger #649). 0.1.4 added the
# arrangement surface at all. 0.2.4 is the pin (set 2026-10-22, ledger #2110): it reads and prints
# an alias rule's `ik:resolveAt "root"` as `:resolve-at root` (ikigai-sexpr#25, ledger #2085), so
# "A space that changes while it runs" writes its view as an s-expression; 0.2.3 dropped it and
# turned the view into an ordinary rule. Before that the pin was 0.2.3 (set 2026-10-14): 0.2.1 to
# 0.2.3 bound the code-graph decoder by depth and by size and hash each node once in the encoder (ledger
# #1326, #1331, #1332), all behind the `full` feature this book leaves off. Before that the pin was
# 0.2.0, the published head past the old pin's 0.x ceiling (<0.2.0): its one change is that both its
# spaces name themselves (`urn:iki:space:sexpr`, `…:sexpr:arrangement`, ledger #987), and the book
# calls its functions rather than mounting its spaces, so nothing a page prints moved. A 0.x caret:
# also a ceiling (<0.3.0).
ikigai-sexpr = { version = "0.2.4", default-features = false }
# The arrangement as a picture: `render(&Topology)`, an accessible, deterministic SVG. Part VII's
# picture test uses it (a dev-dependency), and `crates/live-space` mounts its space for
# `urn:diagram:kernel`; neither is in the page, so the page pays nothing for it. 0.2.1 is the pin,
# set 2026-10-22 (ledger #2007): it draws `ik:DynamicSpace` as "Dynamic space", with its
# declaration and its current inner tree, which "A space that changes while it runs" shows. It
# also puts `xml:lang="en" lang="en"` on the root `<svg>` and adds the dynamic space's two style
# classes, so the committed tic-tac-toe picture was redrawn at the move: those two lines changed,
# and nothing it draws did. Before that 0.2.0 was the pin, past the first release's 0.x ceiling (<0.2.0): `space()` names itself
# `urn:iki:space:diagram` (ledger #987), and `render` is unchanged, so the picture is the same
# bytes. A 0.x caret, so also a ceiling (<0.3.0).
ikigai-diagram = "0.2.1"
# 0.4.0 is the pin (set 2026-10-14): an out-of-band host call is held to its
# session's capability (ledger #83), an unwired module channel fails at once with a typed error
# (ledger #746), and `ModuleSessionTransport::invoke_session` returns `ikigai_core::Result`, the
# minor bump; no crate here implements that trait (`loadable-module` builds a `ModuleSpace` over
# the in-process transport). A 0.x caret, so also a ceiling (<0.5.0); the old pin "0.3.2" was a
# ceiling below 0.4. Before that the pin was 0.3.2: a failed out-of-band host call is recorded
# as a dependency, which no chapter shows. The status chapter stamps its claims at a version of its
# own (`book_claims` fetches that exact version from crates.io, whatever this pin says); it was
# re-stamped at 0.4.0 with this pin, and every claim held. 0.3.1 over 0.3.0 is a constructor form, no new surface. 0.3.0 is the version where the module wire carries the error TYPE both ways, a result's
# declared golden threads, and the module's cards (so the manifold through a ModuleSpace
# lists the module's own actions and the host enforces its `requires` from its own
# description). It was a minor bump because `ModuleCall`/`ModuleReply` are exhaustive
# public enums and gained variants; `ModuleSpace::new(prefixes, transport, floor)` did not
# change. ⚠ Under Cargo's 0.x rules the previous pin, "0.2.0", was a CEILING (<0.3.0) as
# well as a floor: the book sat one minor behind for two weeks while describing itself as
# current (ledger item 164). Read a caret on a 0.x crate as a RANGE.
# (Older history: 0.2.0 enforced a module endpoint's declared `requires` across the
# boundary, growing `ModuleSpace::new` its `ModuleFloor` argument; 0.1.9 was the floor
# because `Resolved` grew a public `canonical` field in ikigai-core 0.1.64.)
ikigai-module = "0.4.0"
# The published SPARQL face, for "The graph face": `urn:sparql:select` over the catalog.
# Brings oxigraph, which is the price of a real query engine and is paid by one crate.
# 0.2.5 is the pin (set 2026-10-14; 0.2.6 is newer and inside the caret): a call without its
# required `query` is refused
# with a typed `MissingArgument` naming it, where it was an untyped endpoint error (and `ikigai-rdf`
# 0.2.5 under it does the same for `content` and `with`). "The graph face" always names its query,
# so it prints the same rows. Before that the pin was 0.2.4, the published head then: 0.2.3 counts a GRAPH block's patterns toward
# the enclosing join (ledger #1426, #1429), and 0.2.4 transrepts a `graph=` source to RDF when its
# type is not an RDF syntax (ledger #1442); "The graph face" selects over the catalog's Turtle, which
# is RDF already, and prints the same rows. Before that the pin was 0.2.2, the published head then: an update cannot grow a stored triple term past
# the nesting bound (ledger #1326), and "The graph face" only selects. Before that the pin was
# 0.2.1, the published head past the old pin's 0.x ceiling (<0.2.0): 0.2.0's change is that each
# configuration-free space names itself `urn:iki:space:<module>` (ledger #987), and 0.2.1 sizes the
# SPARQL thread for the build, so debug and release agree (ledger #1025). "The graph face" printed
# the same rows at it. Before that the floor was 0.1.11, for a security fix, not for an API: the
# release cli 0.1.43 adopted (ledger #962), since a book should not teach a face below the floor its
# own host ships; before it, 0.1.7, the API the chapter uses. A 0.x caret: also a ceiling (<0.3.0).
ikigai-sparql = "0.2.5"
# A Turtle parser and the RDF model it produces, for the transreptor the reader writes
# in "Transreption" — the same parser `ikigai-vocab` tests its own output with.
oxttl = "0.2"
oxrdf = "0.3"
