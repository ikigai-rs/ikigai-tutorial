# The ikigai tutorial workspace.
#
# Books are mdbook projects under `books/`. The code each book teaches is a real crate
# under `crates/`, and the book pulls its snippets in by ANCHOR rather than copying
# them — so there is one `camel-case`, and it is the one that compiles.
#
# `mdbook test` then runs every runnable block in the book as a doctest, which is the
# property worth protecting: a tutorial's examples rot silently, and the first reader
# to hit a stale one assumes they are the problem.
[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
edition = "2021"
license = "MIT"
authors = ["Brian Sletten <brian.sletten@gmail.com>"]
repository = "https://github.com/ikigai-rs/ikigai-tutorial"

# Only the in-page kernel (`crates/book-wasm`) is built in release, and it is shipped to
# a browser: size is the cost that matters there. Same profile ikigai-web-demo uses.
[profile.release]
opt-level = "z"
lto = true

[workspace.dependencies]
# Published crates, deliberately — NOT path refs to sibling checkouts. A reader who
# clones only this repo must be able to `cargo run` immediately; path refs would
# require them to have the whole ecosystem laid out beside it.
# Every ikigai pin in this workspace sits at its crate's newest published release as of
# 2026-10-10, so the book teaches what a reader's fresh `cargo add` resolves. Where a pin moved for
# that alone its comment says so, and the reason that set the previous floor is kept beneath it.
# 0.1.98 is the pin because it is core's published head (0.1.97 is YANKED: it was published from a
# draft branch, and a lock must never hold it), and because the book prints what 0.1.97 changed: a
# refusal at a FAMILY scope (`prefix*`) names what satisfies it, `capability does not grant
# `urn:cap:script:run:open-*` (declared by `…`; any grant under `urn:cap:script:run:open-`
# satisfies it)`, which "Who a script runs as" shows (ledger #1292, #1323); an exact scope's
# refusal is unchanged byte for byte. 0.1.98 adds only what no page uses: a `%` in an endpoint id
# or input name is a character (`%25`) wherever an IRI is minted from the name, and an authored
# scope that is not an IRI is a literal in every face. ⚠ The `ikigai` the books replay
# (cli 0.1.55) and the pinned gonk (2598192) still link 0.1.96, so a REPL transcript or a gonk
# console prints the family refusal without that clause; a crate's own run and an in-page cell
# print it with. Before that the pin was 0.1.96: what the pinned gonk links, and the cli crates
# at 0.1.52 (engine, resolve, ipc, quic, web) require it: it adds the layer vocabulary (ledger
# #1182), which no page uses, and nothing a page prints moved. Before that the pin was 0.1.95,
# core's published head and what the cli 0.1.46 crates required: 0.1.94 refuses a sign in a percent escape of a
# match or contract IRI (`%+1`), and 0.1.95 parses those IRIs leniently and emits only their
# canonical spelling (`canonical_match_iri`, `canonical_contract_iri`), and a Sink or Delete the
# kernel dispatched cuts its target whether it succeeded or failed (a refusal before dispatch
# cuts nothing). No page printed differently at it: every cell, every `cargo run` output and
# every transcript replayed unchanged. Before that the pin was 0.1.93, core's head on the
# morning of 2026-10-10 (0.1.92: a failed invocation is a trace node; 0.1.93: a principal is a
# capability scope, and `Invocation::depends_on` names the thread a failure hangs from), with
# nothing printed differently either. Before that, 0.1.91 was the floor because the book prints what it changed (ledger #948, #1034): an action's
# match has its own IRI, `urn:ikigai:match:{verb}:{pattern}`, one per door and verb, and the
# contract behind it is CONTENT-ADDRESSED, `urn:ikigai:contract:{id}:{verb}:b3:{hex}`, joined to
# the match by `ik:contract`. The old per-id `urn:ikigai:endpoint:{id}:action:{verb}` is gone, so
# every `Meta` and catalog graph a chapter shows moved with it, and a book below 0.1.91 would
# print IRIs its own pages no longer quote. 0.1.90 changed nothing here (vocab's space names
# itself). A 0.x caret: also a ceiling (<0.2.0). Before that the floor was 0.1.87, because three
# chapters run what it added: `urn:kernel:explain`, the dry run
# of a resolution ("Tracing a resolution"), `urn:kernel:dependents`, what cutting a golden thread
# would recompute ("Golden threads"), and `Description::unsatisfied_scopes`, the floor's own
# predicate, which "Identity" uses to check that a published grant list covers every verb (ledger
# #932–#934); 0.1.89's one behavioral change (binding a door drops a space's name) touched
# nothing here: no book crate names a space. Before that the floor was 0.1.84, because part VII's test compares the coded game with the declared one
# through `Kernel::root_topology()`, the root space's own arrangement, instead of unwrapping the
# chain a request carries by hand; and because ikigai-sexpr 0.1.5 requires it (declarations are
# bounded in core's units). Before that the floor was 0.1.83, because tic-tac-toe's part VII
# teaches what it added: a space BUILT from its declaration (`Topology::from_turtle` behind the
# `declare` feature, `Registry`, `build`), the inverse of `urn:kernel:topology`, with every door
# naming the endpoint that answers it. Before that the floor was 0.1.82, because the spreadsheet arc teaches what it added: the
# cache readout marks a row `live`, `cut` or `expired`, and `urn:kernel:cached target=` answers for the
# asker (ledger #612), which is what lets the page's cache viewer be a composition; and a
# fallback over a composite's NotFound is cut when the atom changes (ledger #611), which
# turns part V's trap into history. (Before that the floor was 0.1.78, for the six releases
# 0.1.73–0.1.78: a cacheable read hangs from its own name (0.1.73), `Scope::with_named_at` +
# `Kernel::is_cached_in` for as-of resolution (0.1.75), `Limit` (0.1.76), `.lossy()` and the
# `lossy=allow` consent (0.1.77), and `urn:kernel:topology` (0.1.78); before that 0.1.72,
# where the resolution chain arrived; before that 0.1.66, which `ikigai-vocab` 0.1.66
# requires.)
ikigai-core = "0.1.98"
# `TurtleRenderer`: the projection of a `Description` to Turtle, injected into the
# kernel so `urn:kernel:catalog` and `Meta` answer in the book's own host. 0.1.98 is the pin
# because it is the release paired with core 0.1.98 (0.1.97 is yanked with core's): it spells a `%`
# in an endpoint id or input name as `%25` and moves `owl:versionInfo`, and no page renders either.
# Before that the pin was 0.1.96, paired with core 0.1.96 (it defines the layer family, which no page
# renders). Before that the pin was 0.1.95, paired with core 0.1.95; 0.1.94 and 0.1.95 change only its
# `owl:versionInfo` and its tests (the shared contract vectors), and it still requires core
# 0.1.91 or later. Before that the pin was 0.1.93, paired with core 0.1.93. Before
# that, 0.1.91 was the floor because it renders each action at its content-addressed contract IRI (above), with the
# action's inputs under that contract, and its vocabulary defines `ik:contract` and documents
# `ik:ActionMatch`'s new subject; it requires core 0.1.91. Before that the pin was 0.1.66, the release core 0.1.66
# paired with, while the lock resolved 0.1.78. A 0.x caret: also a ceiling (<0.2.0).
ikigai-vocab = "0.1.98"
# 0.3.0: compose became a view template language. `$h{…}` splices a value HTML-escaped and
# never expands it, which retires the sheet's `html:{ref}` stopgap; `compose_over(src)` binds a
# template at a view's name, which retires the grid's request of glue. ⚠ A 0.x caret is a
# ceiling too: "0.3.1" admitted nothing from 0.4, and the book sat behind that ceiling until
# 2026-10-10. 0.3.1 became the floor because part VII uses what it added: `ComposeOver::named`,
# so each of the game's views carries a name of its own, which is what a declared door binds it
# by (an unnamed one is `composeOver`, like every other). 0.4.1 is the pin because it is the
# published head: 0.4.0's one change is that `space()` names itself `urn:iki:space:fn` (ledger
# #987), and the book binds compose behind doors of its own, and binding a door drops a space's
# name (core 0.1.89), so no answered-by or topology a page prints moved; 0.4.1 exports
# `MARKER_LETTERS` and `escape_markers`, which nothing here uses. A 0.x caret: also a ceiling
# (<0.5.0).
ikigai-fn = "0.4.1"
# An arrangement written as an s-expression (`*.arrangement`, `text/x-ikigai-arrangement`),
# transrepted losslessly to and from the `ik:` Turtle core builds a space from. 0.1.5 is the
# floor because it added `arrangement_space()`, which mounts the arrangement surface alone, and
# the `full` feature, off here: nothing in the tutorial mounts the query or graph compilers or
# the code-graph codec, so the page compiles neither `sha2` nor `oxrdfio` (ledger #649). 0.1.4
# added the arrangement surface at all. 0.2.0 is the pin because it is the published head, past
# the old pin's 0.x ceiling (<0.2.0): its one change is that both its spaces name themselves
# (`urn:iki:space:sexpr`, `…:sexpr:arrangement`, ledger #987), and the book calls its functions
# rather than mounting its spaces, so nothing a page prints moved. A 0.x caret: also a ceiling
# (<0.3.0).
ikigai-sexpr = { version = "0.2.0", default-features = false }
# The arrangement as a picture: `render(&Topology)`, an accessible, deterministic SVG. Only
# part VII's picture test uses it (a dev-dependency), so the page pays nothing for it. 0.2.0 is
# the published head, past the first release's 0.x ceiling (<0.2.0): `space()` names itself
# `urn:iki:space:diagram` (ledger #987), and `render` is unchanged, so the picture is the same
# bytes. A 0.x caret, so also a ceiling (<0.3.0).
ikigai-diagram = "0.2.0"
# 0.3.2 is the pin because it is the published head: a failed out-of-band host call is recorded
# as a dependency, which no chapter shows. The status chapter still stamps its claims at 0.3.1
# (`book_claims` fetches that exact version from crates.io, whatever this pin says), so moving
# this line restamps nothing. 0.3.1 over 0.3.0 is a constructor form, no new surface. 0.3.0 is the version where the module wire carries the error TYPE both ways, a result's
# declared golden threads, and the module's cards (so the manifold through a ModuleSpace
# lists the module's own actions and the host enforces its `requires` from its own
# description). It was a minor bump because `ModuleCall`/`ModuleReply` are exhaustive
# public enums and gained variants; `ModuleSpace::new(prefixes, transport, floor)` did not
# change. ⚠ Under Cargo's 0.x rules the previous pin, "0.2.0", was a CEILING (<0.3.0) as
# well as a floor: the book sat one minor behind for two weeks while describing itself as
# current (ledger item 164). Read a caret on a 0.x crate as a RANGE.
# (Older history: 0.2.0 enforced a module endpoint's declared `requires` across the
# boundary, growing `ModuleSpace::new` its `ModuleFloor` argument; 0.1.9 was the floor
# because `Resolved` grew a public `canonical` field in ikigai-core 0.1.64.)
ikigai-module = "0.3.2"
# The published SPARQL face, for "The graph face": `urn:sparql:select` over the catalog.
# Brings oxigraph, which is the price of a real query engine and is paid by one crate.
# 0.2.1 is the pin because it is the published head, past the old pin's 0.x ceiling (<0.2.0):
# 0.2.0's change is that each configuration-free space names itself `urn:iki:space:<module>`
# (ledger #987), and 0.2.1 sizes the SPARQL thread for the build, so debug and release agree
# (ledger #1025). "The graph face" printed the same rows at it. Before that the floor was 0.1.11,
# for a security fix, not for an API: the release cli 0.1.43 adopted (ledger #962), since a book
# should not teach a face below the floor its own host ships; before it, 0.1.7, the API the
# chapter uses. A 0.x caret: also a ceiling (<0.3.0).
ikigai-sparql = "0.2.1"
# A Turtle parser and the RDF model it produces, for the transreptor the reader writes
# in "Transreption" — the same parser `ikigai-vocab` tests its own output with.
oxttl = "0.2"
oxrdf = "0.3"
# The gonk Book. gonk itself is NOT a dependency of any crate here: it is a binary, pinned to a
# git rev in `books/gonk/gonk.rev` (it is not on crates.io), and installed only by
# `scripts/test-transcripts.sh`. What the book's crates link are the published modules gonk is
# built from, and they follow gonk's lock until a release the book needs runs ahead of it. ⚠ That
# is the case NOW (2026-10-12, ledger #1323): the gonk in `gonk.rev` (2598192) links core 0.1.96,
# ledger 0.9.0 and store 0.2.15, while these crates take core 0.1.98, ledger 0.11.0 and store 0.2.19,
# each its crate's published head; gonk's own main links the same older three. A console
# transcript is gonk's answer and a cell or `cargo run` is these crates', each checked against its
# own source, so the gap shows only where the releases differ in what they print: a family-scope
# refusal (core 0.1.97), which no gonk-book cell prints and its consoles print without the new
# clause. books/gonk/DESIGN.md records the gap. (Until 9f2e89e the pinned gonk, 9704b54, linked
# ledger 0.6.2 while these crates took 0.9.0, so no transcript could ask `count`; ledger #1245
# closed that gap.)
# 0.11.0 is the pin because it is the published head: 0.10.0 adds `urn:cap:ledger:about:{ledger}`,
# which adds and removes an item's `about` edges without the close grant (`write:{ledger}` still
# covers it, so `ledger-host`'s writer is unchanged), and `item:{id}:about` now declares the family
# `urn:cap:ledger:*`, as claim, comment and close do (ledger #1315); 0.11.0 adds a claim kind,
# `agent` (`ClaimKind::Agent`, and `ClaimKind` is `#[non_exhaustive]` from now on; ledger #1329),
# which no crate here matches on or stamps. Every cell and Rust chapter prints what it did on 0.9.0.
# The API floor is 0.9.0, because part 5 ("The ledger as the work queue") asks the ledger how many
# items implement a requirement with `urn:iki:ledger:count`, which 0.9.0 added (the total alone,
# one COUNT query, without `items`' page or its corpus check; ledger #1128). Below that, 0.4.0 is
# the floor `sync_ledger` needs: the keyed append (`append key=<task IRI>`: at most one item per
# key, enforced by the ledger in the same store update that files it, answering `existing` when
# the key is taken), which is what makes two concurrent syncs safe. It also made `Item` and
# `Filter` `#[non_exhaustive]`; no crate here builds either.
# What 0.7.0 and 0.8.0 brought (neither was published on its own; 0.9.0 carries both): per-verb
# grants `urn:cap:ledger:{claim,comment,close}:{ledger}`, which `write:{ledger}` still covers, so
# `ledger-host`'s four-token writer is unchanged; a close RELEASES the item's claim in the same
# update (no page closes a claimed item, so no answer a page prints moved); `release from=`,
# `claim renew=true`, keyed comments, `comment handback=true` (an awaiting-dispatcher state that
# `next` excludes), and a claim's holder bound to the capability's principal when it carries one
# (root carries none, so every claim here is the free-text holder it was). Every cell and Rust
# chapter prints what it did on 0.6.2.
# Before 0.9.0 the pin was 0.6.2: 0.6.0 names `space()` `urn:iki:space:ledger` (ledger #987),
# 0.6.1 draws a real id nonce in the browser (ledger #797), and 0.6.2 makes a page of `items` say
# it is a page (`1–2 of 5 item(s)`, with `offset=`; ledger #419), adds `…:item:{id}:about`, and
# floors ikigai-store at 0.2.10. Before that the pin was 0.5.0 (an item's lifecycle state as a
# compare-and-set atom, claim leases with a kind the host stamps, and the doctor; ledger #775),
# then 0.4.2, where a malformed timestamp stopped dropping an item from `items`/`next` (ledger
# #866). Before 0.4.0 the floor was 0.3.0, which fixed the unled audit's findings on 0.2.1 that
# the first chapter walks straight through: two appends in one millisecond minting the same id,
# and `next` cached across the clock. A 0.x caret, so also a ceiling (<0.12.0): read it as a RANGE.
# The old pin, "0.9.0", was a ceiling below 0.10 and held the book at 0.9.
ikigai-ledger = "0.11.0"
# The store the ledger is written in. In-memory only here (`persistent`, the RocksDB backend,
# stays off): a book's kernel holds nothing past the process, and the page's kernel cannot link
# RocksDB at all. 0.2.19 is the pin because it is the published head (with ledger 0.11.0, ahead of
# the pinned gonk, which links 0.2.15): 0.2.16 and 0.2.17 make every `SharedWriter::over` on one
# handle share the store's one writer (ledger #1276, #1324), 0.2.18 adds `EvaluationBudget`, a time
# budget for SPARQL a consumer evaluates itself (ledger #1327), and 0.2.19 bounds the RDF 1.2 triple
# terms an update leaves in the store and reads `<<(` as one token (ledger #1333, #1354). No crate
# here calls `over` or the budget, no page writes a triple term, and every answer a page prints is
# the same. Before that, 0.2.12 was the pin because it was the published head, and markdown 0.1.3
# requires 0.2.11: 0.2.11 words a SPARQL `SERVICE` refusal for the consumer that asked (ledger
# #1094), and 0.2.12 runs every update on the store's one writer thread, so reads after a bulk
# write stay fast (ledger #1127). No page uses `SERVICE`, and no query a page runs changed its
# answer. 0.2.14 is the pin now because it is what the pinned gonk (9f2e89e) links: 0.2.13 copies
# a scoped update's footprint rather than the whole graph (ledger #1132), and 0.2.14 hands a host
# that writes through the raw handle the store's own writer thread (`SharedWriter`, ledger #1207),
# which no crate here uses; every answer a page prints is the same. 0.2.15 is the pin because it
# is what the pinned gonk (2598192) links: it enforces the graphs an update declares and loads on
# the writer thread (ledger #1207, #1209). Before that the pin was 0.2.14. Before 0.2.14
# the pin was 0.2.12 for the reasons above. Before that the pin was 0.2.10, the head on the morning of 2026-10-10, which ledger
# 0.6.2 requires: 0.2.9 bounds the SIZE of every SPARQL answer, refusing rather
# than truncating (ledger #970), and 0.2.10 sizes the SPARQL thread for the build (ledger #1003).
# No query a page runs comes near either bound. Before that the pin was 0.2.8, what gonk edb9a3d
# links (gonk PR 104), and 0.2.7 is a security floor below which no book crate should sit (ledger
# #915; cli 0.1.43 adopted it). A 0.x caret: also a ceiling (<0.3.0).
ikigai-store = { version = "0.2.19", default-features = false }
# The repository browser and its model-derived layers (explain, review, findings), for The gonk
# Book's "Explain, with a mounted model" and "One-off review". 0.18.6 is the pin because it is what
# the pinned gonk (2598192) links: 0.18.5 writes every archive record in one transaction on
# ikigai-store's `SharedWriter` (ledger #1207, #1253), and 0.18.6 adds
# `Mount::annotations_through`, writing annotations through a host's writer (ledger #1252), which
# no crate here calls. Before that the pin was 0.18.4, what gonk 9f2e89e linked: 0.18.3 lists a symlink in the tree only when the jail serves its
# target (ledger #1130), and 0.18.4 commits every browse write on one writer thread, so reads after
# a burst of writes stay fast (ledger #1131). No chapter's root holds a symlink, and the stub
# model's explanations and findings printed the same at it. 0.18.2 is a SECURITY floor: it never
# serves a repository's `.git` (refused at the jail, hidden from the listing; ledger #1126). No chapter lists or reads
# `.git`, so nothing a page prints moved. Before that the pin was 0.18.1: a review answer's last finding is kept when it cannot have been cut (ledger
# #818), and the chapter's stub answer printed the same findings at it. The floor is 0.18.0, the
# release that added the explain-status cost line the chapter shows ("opens instantly from the
# archive"), and what gonk edb9a3d links. A 0.x caret: also a ceiling (<0.19.0); read it as a
# RANGE.
ikigai-browse = "0.18.6"
# The RDF store browse keeps its archive, findings and annotations in. browse takes an
# `oxigraph::store::Store` directly (not `ikigai-store`), so a host names the crate itself. In
# memory: default features off, as every other oxigraph line in this workspace's graph.
oxigraph = { version = "0.5.11", default-features = false }
# Markdown as a graph, for the OpenSpec part: one generic structural lift plus a MAPPING resource
# (a lift profile and SPARQL CONSTRUCTs), found by name at `urn:markdown:mapping:{name}` under a
# config home. 0.1.3 is the pin because it is the published head: it words the `SERVICE` refusal
# as a mapping's remedy rather than the store's (ledger #1108). Before that the pin was 0.1.2:
# 0.1.1 bounds a mapping's SPARQL
# and reads frontmatter without recursion (ledger #963), and 0.1.2 refuses SPARQL `SERVICE` in a
# mapping in every build (ledger #1085). The OpenSpec mapping uses neither `SERVICE` nor deep
# frontmatter, so it lifts the same graph. 0.1.0 is the first release on crates.io (2026-10-06);
# before it, this line was a pin to one full git revision of the public repository, the way
# DESIGN.md pins gonk. A 0.x caret, so also a ceiling (<0.2.0).
ikigai-markdown = "0.1.3"
# Scripts as resources, for the section "Code and language as resources": `urn:script:{name}`
# with content-addressed versions, `…:result` (run as a read) and `…:runs` (run for effects),
# under the least of what a script declares, what its publisher held and the host's ceiling.
# 0.3.3 is the pin and the floor for what the chapters PRINT: a run of a draft is refused for its
# state ("… is a draft; publish it to run it"), where before it the generic run contract declared
# `urn:cap:lisp` and the author of a SPARQL draft was told her capability did not grant Lisp
# (ledger #1261), and a query that reads no graph is refused saying what to write (ledger
# #1278). The API floor is 0.3.0: "Who a script runs as" teaches NAMESPACE grants
# (`urn:cap:script:write:team-*`) and exclusions, and `authority::holds`, which arrived there
# (ledger #1173, #1174); 0.3.1 and 0.3.2 fix plans (ledger #1220, #1222), which no chapter
# publishes. It requires core 0.1.95, the line above. A 0.x caret: also a ceiling (<0.4.0);
# read it as a RANGE.
ikigai-script = "0.3.3"
# Natural language to a DRAFT script, for "A sentence becomes a draft": `urn:nl:grounding` (what
# the caller may see, as data), `urn:nl:sparql:check` and the drafter `urn:nl:sparql`. 0.4.0 is the
# pin and the floor: it is the published head, and the release whose drafter, when the model gives
# a draft it already gave, marks that attempt a repeat (`repeatOf` in JSON, `prov:alternateOf` in
# Turtle) and says "drafting stopped: the model repeated attempt N" rather than naming a bound it
# did not reach (ledger #1298), which the chapter's stub shows. 0.3.0 made an empty preview a
# warning with its evidence (the patterns that match nothing alone), repaired and marked it, stated
# each predicate's value kinds in the grounding, and gave the drafter `focus=` (`graph=` a
# deprecated alias; ledger #1242, #1243). 0.2.1 asked the script host's own rule whether the caller
# may read a named example (ledger #1196); 0.2.0 bounded each draft with `max_tokens` (ledger
# #1203), which the stub model records. It requires ikigai-script 0.3.0 itself. A 0.x caret: also a
# ceiling (<0.5.0); the old pin "0.3.0" was a ceiling below 0.4 and held the book at 0.3.
ikigai-nl = "0.4.0"
# A real model, for the reader who has one: "A sentence becomes a draft" runs against a stub in
# every gate (no network, ever), and `cargo run -p sentence-draft -- --ollama MODEL` swaps in
# `ikigai-llm`'s `urn:llm:ask` over a local Ollama. The newest published releases: llm 0.13.1 and
# the HTTP seam it is built on, ikigai-http 0.1.9 (`HttpTransport`, which the host fills; 0.1.7
# is llm's own floor, the port-aware network gate). 0.x carets: ceilings too (<0.14.0, <0.2.0).
ikigai-llm = "0.13.1"
ikigai-http = "0.1.9"
# The blocking HTTP client that fills `HttpTransport` for that one path, as ikigai-llm's own
# `ask` example does. No default features: no TLS, since a local Ollama speaks plain HTTP on
# localhost. "2" is that example's line; a caret, so <3.0.0.
ureq = { version = "2", default-features = false }
# The JSON faces the drafting chapter reads back (a draft's attempts, a check's findings).
serde_json = "1"
# The config file "Configuration" reads through `layered_paths`.
toml = "0.8"
futures = "0.3"
