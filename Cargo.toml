# The ikigai tutorial workspace.
#
# Books are mdbook projects under `books/`. The code each book teaches is a real crate
# under `crates/`, and the book pulls its snippets in by ANCHOR rather than copying
# them — so there is one `camel-case`, and it is the one that compiles.
#
# `mdbook test` then runs every runnable block in the book as a doctest, which is the
# property worth protecting: a tutorial's examples rot silently, and the first reader
# to hit a stale one assumes they are the problem.
[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
edition = "2021"
license = "MIT"
authors = ["Brian Sletten <brian.sletten@gmail.com>"]
repository = "https://github.com/ikigai-rs/ikigai-tutorial"

[workspace.dependencies]
# Published crates, deliberately — NOT path refs to sibling checkouts. A reader who
# clones only this repo must be able to `cargo run` immediately; path refs would
# require them to have the whole ecosystem laid out beside it.
# 0.1.66 is the floor because `ikigai-vocab` 0.1.66 — the Meta renderer the tutorial
# host is built with — requires exactly that core. Nothing here asks for a newer API.
ikigai-core = "0.1.66"
# `TurtleRenderer`: the projection of a `Description` to Turtle, injected into the
# kernel so `urn:kernel:catalog` and `Meta` answer in the book's own host.
ikigai-vocab = "0.1.66"
ikigai-fn = "0.2.0"
# 0.1.9 is the floor and it is not a preference: `Resolved` grew a public `canonical`
# field in ikigai-core 0.1.64, and ikigai-module 0.1.8 constructs one — so that pair no
# longer compiles together. This workspace only found out when Part III's dependencies
# raised the resolved core past 0.1.63; the lockfile had been holding 0.1.62 and hiding it.
ikigai-module = "0.1.10"
# The published SPARQL face, for "The graph face": `urn:sparql:select` over the catalog.
# Brings oxigraph, which is the price of a real query engine and is paid by one crate.
ikigai-sparql = "0.1.7"
# A Turtle parser and the RDF model it produces, for the transreptor the reader writes
# in "Transreption" — the same parser `ikigai-vocab` tests its own output with.
oxttl = "0.2"
oxrdf = "0.3"
# The config file "Configuration" reads through `layered_paths`.
toml = "0.8"
futures = "0.3"
